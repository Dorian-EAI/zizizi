    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Client (Teal) */
  --brand: #0D9488;
  --brand-dark: #0A7A70;
  --brand-mid: #14B8A6;
  --brand-light: #CCFBF1;
  --brand-glow: rgba(13, 148, 136, 0.24);
  --brand-subtle: rgba(13, 148, 136, 0.10);
  --brand-gradient: linear-gradient(135deg, #0D9488 0%, #14B8A6 48%, #D4944C 100%);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #0D9488;

  /* Primary */
  --primary: #0D9488;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

  /* Font — unified serif system */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:    'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:    'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:         var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --radius-full: var(--radius-full);
}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Tab Bar — Premium Liquid Glass, absolute-positioned within .phone frame */
.tab-bar{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:360px;
  height:56px;
  z-index:100;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(48px) saturate(210%);
  -webkit-backdrop-filter:blur(48px) saturate(210%);
  border:0.5px solid rgba(255,255,255,0.45);
  border-radius:24px;
  box-shadow:
    inset 0 1.5px 3px rgba(255,255,255,0.60),
    inset 0 -0.5px 1px rgba(255,255,255,0.20),
    0 0 0 0.5px rgba(0,0,0,0.04),
    0 2px 10px rgba(0,0,0,0.06),
    0 12px 36px rgba(0,0,0,0.08);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 6px;
}
.tab-bar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(160deg,
    rgba(255,255,255,0.42) 0%,
    rgba(255,255,255,0.16) 20%,
    rgba(255,255,255,0.03) 40%,
    transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  padding:0.5px;
  pointer-events:none;
  z-index:1;
}
.tab-bar::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(320deg,
    transparent 60%,
    rgba(13,148,136,0.06) 80%,
    rgba(255,255,255,0.04) 100%);
  pointer-events:none;
  z-index:1;
}
.tab-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  width:68px;
  height:44px;
  border-radius:14px;
  color:var(--text-3);
  font-size:11px;
  font-weight:500;
  text-decoration:none;
  position:relative;
  transition:all .2s;
}
.tab-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.tab-item[data-active="true"]{
  color:var(--brand);
  font-weight:600;
}
.tab-item[data-active="true"]::before{
  content:"";
  position:absolute;
  width:54px;
  height:42px;
  border-radius:16px;
  background:rgba(13,148,136,0.16);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:0.5px solid rgba(13,148,136,0.30);
  box-shadow:
    inset 0 1px 3px rgba(255,255,255,0.55),
    inset 0 -0.5px 1px rgba(255,255,255,0.15),
    0 2px 10px rgba(13,148,136,0.20),
    0 0 0 0.5px rgba(13,148,136,0.08);
  z-index:0;
}
.tab-item[data-active="true"] svg{
  transform:scale(1.08);
  position:relative;
  z-index:1;
}

/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --phone-bg:#F2EDE8;
  --border-glass:0.5px solid rgba(255,255,255,0.60);
  --border-glass-soft:0.5px solid rgba(255,255,255,0.45);
  --icon-raise:5px 5px 10px var(--neu-dark),-5px -5px 10px var(--neu-light);
  --icon-inset:inset 3px 3px 6px var(--neu-dark),inset -3px -3px 6px var(--neu-light);
}
html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:var(--body-bg);letter-spacing:-0.01em}

/* ===== Phone Frame ===== */
.phone{position:relative;width:414px;min-height:896px;background:var(--phone-bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:82px}
.phone::-webkit-scrollbar{display:none}
.phone{scrollbar-width:none}
.phone::after{content:'';position:absolute;bottom:0;left:0;right:0;height:260px;background:radial-gradient(ellipse 180px 120px at 20% 90%,rgba(13,148,136,.05) 0%,transparent 70%),radial-gradient(ellipse 160px 100px at 80% 85%,rgba(212,148,76,.05) 0%,transparent 70%);pointer-events:none;z-index:0}
.phone>*:not(.tab-bar):not(.top-header){position:relative;z-index:1}

/* Top Header */
.top-header{position:sticky;top:0;z-index:50}

/* Hero */
.hero{padding: max(38px, env(safe-area-inset-top)) 24px 24px;position:relative;z-index:1;background:radial-gradient(ellipse 240px 200px at 75% 40%,rgba(212,148,76,.16) 0%,transparent 70%),radial-gradient(ellipse 200px 160px at 20% 80%,rgba(13,148,136,.12) 0%,transparent 70%),linear-gradient(135deg,rgba(13,148,136,.12) 0%,rgba(212,148,76,.14) 50%,rgba(20,184,166,.12) 100%);border-radius:0 0 32px 32px}
.hero::before{content:"";position:absolute;top:-40%;right:-20%;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero::after{content:"";position:absolute;bottom:-30%;left:-10%;width:220px;height:220px;background:radial-gradient(circle,rgba(200,255,250,0.10) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.nav-content{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;position:relative;z-index:2}
.nav-back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:0.5px solid rgba(255,255,255,0.30);display:flex;align-items:center;justify-content:center;color:var(--text-1);cursor:pointer;box-shadow:inset 0 1px 2px rgba(255,255,255,0.3);flex-shrink:0;transition:transform var(--dur) var(--spring),background 0.2s var(--ease)}
.nav-back:active{transform:scale(0.85);background:rgba(255,255,255,0.32)}
.nav-back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-title{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em;text-align:center;justify-self:center}
.nav-edit{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:0.5px solid rgba(255,255,255,0.30);box-shadow:inset 0 1px 2px rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;color:var(--text-1);cursor:pointer;flex-shrink:0;transition:transform var(--dur) var(--spring),background 0.2s var(--ease)}
.nav-edit:active{transform:scale(0.85);background:rgba(255,255,255,0.32)}
.nav-edit svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Filter Pills (overlaps hero) */
.filter-tabs{margin:-18px 20px 0;background:rgba(255,255,255,0.52);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,0.70);border-radius:var(--radius-md);box-shadow:var(--neu-out-md),0 6px 28px rgba(0,0,0,0.06),0 0 0 1px rgba(44,40,36,0.05);padding:8px;display:flex;gap:6px;position:relative;z-index:10}
.filter-tabs::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none}

.filter-pill{flex:1;text-align:center;padding:10px 0;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer;white-space:nowrap;transition:transform var(--dur) var(--spring),all 0.2s var(--ease);border:none;background:transparent;font-family:var(--font)}
.filter-pill:active{transform:scale(0.94)}
.filter-pill:not(.active){background:var(--bg-elevated);box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45)}
.filter-pill.active{background:rgba(13,148,136,.08);box-shadow:inset 2px 2px 5px var(--neu-dark),inset -2px -2px 5px var(--neu-light);color:var(--brand)}

/* ===== Section Title ===== */
.section-title{font-size:16px;font-weight:700;color:var(--text-1);padding:14px 20px 10px;letter-spacing:-0.2px}

/* ===== Worker List ===== */
.worker-list{padding:6px 20px 4px}

/* ===== Worker Card (玻璃新拟态) ===== */
.worker-card{margin-bottom:14px;padding:16px;background:var(--surface-1);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:var(--border-glass-soft);border-radius:22px;box-shadow:var(--neu-out-md);position:relative;transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease)}
.worker-card:active{transform:scale(0.985);box-shadow:var(--neu-out-sm)}
.worker-card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none}

.worker-head{display:flex;align-items:flex-start;gap:14px}

/* Avatar + Level Badge */
.avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;width:52px}
.avatar{width:44px;height:44px;border-radius:50%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--brand-dark);letter-spacing:0;background:linear-gradient(145deg,rgba(255,255,255,0.68) 0%,rgba(255,255,255,0.28) 40%,var(--brand-subtle) 78%,rgba(255,255,255,0.18) 100%);backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);border:0.5px solid rgba(255,255,255,0.75);box-shadow:inset 0 2px 3px rgba(255,255,255,0.88),inset 0 -1px 2px rgba(0,0,0,0.04),var(--icon-raise)}
.avatar::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,0.48) 0%,rgba(255,255,255,0.12) 35%,transparent 60%);pointer-events:none}
.level-badge{font-size:9px;font-weight:700;color:#fff;padding:2px 8px;border-radius:9999px;white-space:nowrap;border:0.5px solid rgba(255,255,255,0.55);box-shadow:0 2px 6px rgba(0,0,0,0.12);letter-spacing:0.2px}
.level-badge.gold{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);box-shadow:0 2px 6px rgba(212,148,76,.16)}
.level-badge.normal{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);box-shadow:0 2px 6px rgba(13,148,136,.12)}

/* Worker Info */
.worker-info{flex:1;min-width:0;padding-top:2px}
.name-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.worker-name{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em}
.rating{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--orange)}
.rating svg{width:13px;height:13px;color:var(--orange)}
.meta-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin-bottom:9px;font-weight:500}
.meta-item{display:inline-flex;align-items:center;gap:3px}
.meta-ico{width:12px;height:12px;stroke:var(--text-2);fill:none;flex-shrink:0}
.dot-sep{width:3px;height:3px;border-radius:50%;background:var(--text-3);flex-shrink:0}

/* Tag Chips */
.tag-chips{display:flex;gap:6px;flex-wrap:wrap}
.tag-chip{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-subtle);padding:3px 9px;border-radius:9999px;border:0.5px solid rgba(13,148,136,.10)}

/* Worker Foot */
.worker-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:14px;border-top:0.5px solid var(--sep)}
.auth-badges{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.auth-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--green);background:rgba(91,140,90,0.10);padding:3px 8px;border-radius:7px;border:0.5px solid rgba(91,140,90,0.16);white-space:nowrap}
.auth-badge svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actions{display:flex;gap:10px;flex-shrink:0}

/* ===== btn-neu-primary base (head 仅有 :active) ===== */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand-gradient);
  color:var(--text-inverse);
  border:0.5px solid rgba(13,148,136,.12);border-radius:9999px;
  padding:8px 18px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 4px 12px rgba(13,148,136,.12);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}

@media (prefers-reduced-motion:reduce){
  .nav-back,.nav-edit,.chip,.worker-card,.btn-neu-primary,.btn-neu-ghost,.btn-neu-secondary{transition:none}
}
</style>

</body>
</html>
