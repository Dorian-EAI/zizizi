    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Client (Teal) */
  --brand: #0D9488;
  --brand-dark: #0A7A70;
  --brand-mid: #14B8A6;
  --brand-light: #CCFBF1;
  --brand-glow: rgba(13, 148, 136, 0.24);
  --brand-subtle: rgba(13, 148, 136, 0.10);
  --brand-gradient: linear-gradient(135deg, #0D9488 0%, #14B8A6 48%, #D4944C 100%);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #0D9488;

  /* Primary */
  --primary: #0D9488;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

  /* Font — unified serif system */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:    'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:    'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:         var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --radius-full: var(--radius-full);
}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Tab Bar — Premium Liquid Glass, absolute-positioned within .phone frame */
.tab-bar{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:360px;
  height:56px;
  z-index:100;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(48px) saturate(210%);
  -webkit-backdrop-filter:blur(48px) saturate(210%);
  border:0.5px solid rgba(255,255,255,0.45);
  border-radius:24px;
  box-shadow:
    inset 0 1.5px 3px rgba(255,255,255,0.60),
    inset 0 -0.5px 1px rgba(255,255,255,0.20),
    0 0 0 0.5px rgba(0,0,0,0.04),
    0 2px 10px rgba(0,0,0,0.06),
    0 12px 36px rgba(0,0,0,0.08);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 6px;
}
.tab-bar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(160deg,
    rgba(255,255,255,0.42) 0%,
    rgba(255,255,255,0.16) 20%,
    rgba(255,255,255,0.03) 40%,
    transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  padding:0.5px;
  pointer-events:none;
  z-index:1;
}
.tab-bar::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(320deg,
    transparent 60%,
    rgba(13,148,136,0.06) 80%,
    rgba(255,255,255,0.04) 100%);
  pointer-events:none;
  z-index:1;
}
.tab-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  width:68px;
  height:44px;
  border-radius:14px;
  color:var(--text-3);
  font-size:11px;
  font-weight:500;
  text-decoration:none;
  position:relative;
  transition:all .2s;
}
.tab-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.tab-item[data-active="true"]{
  color:var(--brand);
  font-weight:600;
}
.tab-item[data-active="true"]::before{
  content:"";
  position:absolute;
  width:54px;
  height:42px;
  border-radius:16px;
  background:rgba(13,148,136,0.16);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:0.5px solid rgba(13,148,136,0.30);
  box-shadow:
    inset 0 1px 3px rgba(255,255,255,0.55),
    inset 0 -0.5px 1px rgba(255,255,255,0.15),
    0 2px 10px rgba(13,148,136,0.20),
    0 0 0 0.5px rgba(13,148,136,0.08);
  z-index:0;
}
.tab-item[data-active="true"] svg{
  transform:scale(1.08);
  position:relative;
  z-index:1;
}

/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:var(--body-bg);letter-spacing:-0.01em}

/* ===== Phone Frame ===== */
.phone{position:relative;width:414px;min-height:896px;background:var(--background);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:82px}
.phone::-webkit-scrollbar{display:none}
.phone{scrollbar-width:none}
.phone::after{content:'';position:absolute;bottom:0;left:0;right:0;height:260px;background:radial-gradient(ellipse 180px 120px at 20% 90%,rgba(13,148,136,.05) 0%,transparent 70%),radial-gradient(ellipse 160px 100px at 80% 85%,rgba(212,148,76,.05) 0%,transparent 70%);pointer-events:none;z-index:0}
.phone>*:not(.bottom-bar){position:relative;z-index:1}

/* ===== Nav Bar (sticky top) ===== */
.nav-bar{background:radial-gradient(ellipse 220px 160px at 78% 45%,rgba(212,148,76,.10) 0%,transparent 70%),radial-gradient(ellipse 180px 140px at 18% 75%,rgba(13,148,136,.10) 0%,transparent 70%),linear-gradient(135deg,rgba(13,148,136,.08) 0%,rgba(212,148,76,.06) 50%,rgba(13,148,136,.05) 100%);position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:max(18px, env(safe-area-inset-top)) 20px 12px; border-radius:0 0 28px 28px; overflow:hidden;}
.nav-back{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.50);
  border:0.5px solid rgba(255,255,255,0.60);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-1);cursor:pointer;flex-shrink:0;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
}
.nav-back:active{box-shadow:var(--neu-in);transform:scale(0.88)}
.nav-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-title{font-size:18px;font-weight:700;color:var(--text-1);letter-spacing:-0.2px}

/* ===== btn-neu-primary base (head only defines :active) ===== */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand-gradient);
  color:var(--text-inverse);
  border:0.5px solid rgba(255,255,255,0.30);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 4px 12px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}

/* ===== My Annual Card (glass gradient) ===== */
.my-card-wrap{position:relative;z-index:2}
.my-card{
  position:relative;
  padding:22px 22px 20px;
  border-radius:24px;
  overflow:hidden;
  margin:12px 16px 16px;
  background:
    radial-gradient(ellipse 240px 200px at 75% 40%,rgba(212,148,76,.16) 0%,transparent 70%),
    radial-gradient(ellipse 200px 160px at 20% 80%,rgba(13,148,136,.12) 0%,transparent 70%),
    linear-gradient(135deg,rgba(13,148,136,.12) 0%,rgba(212,148,76,.14) 50%,rgba(20,184,166,.12) 100%);
  border:0.5px solid rgba(255,255,255,0.45);
  box-shadow:var(--neu-out-md),0 8px 28px rgba(13,148,136,.07);
}
.my-card-shine{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(165deg,rgba(255,255,255,0.28) 0%,rgba(255,255,255,0.06) 30%,transparent 55%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  padding:0.5px;pointer-events:none;
}
.my-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;position:relative;z-index:1}
.my-card-name{font-size:17px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em}
.my-card-expire{font-size:11px;font-weight:600;color:var(--brand);background:rgba(13,148,136,0.10);border:0.5px solid rgba(13,148,136,0.15);border-radius:9999px;padding:4px 10px;white-space:nowrap;flex-shrink:0}
.my-card-usage{position:relative;z-index:1;margin-bottom:14px}
.usage-num{display:flex;align-items:baseline;gap:1px;color:var(--text-1)}
.usage-used{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.usage-sep{font-size:26px;font-weight:600;opacity:0.5;margin:0 3px}
.usage-total{font-size:26px;font-weight:600;opacity:0.5}
.usage-unit{font-size:15px;font-weight:600;margin-left:6px;opacity:0.88;align-self:flex-end;padding-bottom:3px;color:var(--text-2)}
.usage-label{font-size:12px;color:var(--text-2);margin-top:5px;font-weight:500;letter-spacing:0.02em}
.progress-track{height:10px;border-radius:9999px;background:rgba(255,255,255,0.45);box-shadow:inset 2px 2px 5px var(--neu-dark),inset -2px -2px 5px var(--neu-light);overflow:hidden;margin-bottom:18px;position:relative;z-index:1}
.progress-fill{height:100%;width:66.7%;border-radius:9999px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand-mid) 60%,var(--accent) 100%);box-shadow:0 0 12px rgba(13,148,136,.12)}
.my-card-bottom{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.btn-use{flex:1;height:42px;font-size:14px;background:var(--brand-gradient)}
.btn-refund{font-size:13px;padding:8px 16px}
.btn-submit{width:100%;height:50px;font-size:16px;border-radius:16px;background:var(--brand-gradient)}

/* ===== Section Title ===== */
.section-title{font-size:18px;font-weight:700;color:var(--text-1);padding:22px 24px 14px;letter-spacing:-.2px;position:relative;z-index:2}

/* ===== Plan Cards ===== */
.plan-card{
  margin:0 20px 12px;
  padding:18px 18px 16px;
  border-radius:20px;
  background:var(--surface-1);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:var(--border-glass-soft);
  box-shadow:var(--neu-out-sm);
  position:relative;z-index:2;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.plan-card:active{transform:scale(0.96);box-shadow:var(--neu-in)}
.plan-card--featured{
  background:rgba(13,148,136,.06);
  border:1px solid rgba(13,148,136,.12);
  box-shadow:var(--neu-out-sm),0 0 0 0.5px rgba(13,148,136,.11),0 4px 14px rgba(13,148,136,.10);
}
.plan-badge{
  position:absolute;top:-9px;right:16px;z-index:3;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-mid) 100%);
  color:#fff;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:9999px;
  box-shadow:0 2px 8px rgba(13,148,136,.12),inset 0 1px 1px rgba(255,255,255,0.40);
  letter-spacing:0.02em;
}
.plan-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;position:relative;z-index:1}
.plan-name{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em}
.plan-price{display:flex;align-items:baseline;gap:1px}
.plan-price .cur{font-size:14px;color:var(--accent);font-weight:600}
.plan-price .amt{font-size:26px;color:var(--accent);font-weight:800;letter-spacing:-0.5px;line-height:1}
.plan-card--featured .plan-price .cur,
.plan-card--featured .plan-price .amt{color:var(--brand)}
.plan-benefits{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.plan-benefits li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);line-height:1.4}
.plan-benefits li svg{width:16px;height:16px;flex-shrink:0;color:var(--brand);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.plan-choose{width:100%;height:42px;font-size:14px;position:relative;z-index:1}
.btn-neu-primary.plan-choose{background:var(--brand-gradient)}

/* ===== Chips ===== */
.chips-wrap{display:flex;flex-wrap:wrap;gap:10px;padding:0 24px 8px;position:relative;z-index:2}
.chip{
  padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;border:none;font-family:var(--font);
  background:var(--bg-elevated);color:var(--text-2);
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.chip:active{transform:scale(0.94);box-shadow:var(--neu-in);color:var(--brand)}

/* ===== Bottom Fixed Buy Bar ===== */
.bottom-bar{
  position:absolute;bottom:0;left:0;right:0;z-index:60;
  padding:14px 20px 22px;
  background:linear-gradient(to top,var(--background) 72%,rgba(242,237,232,0.80) 88%,rgba(242,237,232,0));
  backdrop-filter:blur(12px) saturate(160%);
  -webkit-backdrop-filter:blur(12px) saturate(160%);
}
.btn-buy{display:none}

@media (prefers-reduced-motion:reduce){
  .nav-back,.btn-neu-primary,.btn-neu-secondary,.btn-neu-ghost,.plan-card,.chip,.btn-buy{transition:none}
}
</style>

</body>
</html>
