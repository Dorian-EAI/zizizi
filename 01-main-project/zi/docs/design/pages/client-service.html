    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Client (Teal) */
  --brand: #0D9488;
  --brand-dark: #0A7A70;
  --brand-mid: #14B8A6;
  --brand-light: #CCFBF1;
  --brand-glow: rgba(13, 148, 136, 0.24);
  --brand-subtle: rgba(13, 148, 136, 0.10);
  --brand-gradient: linear-gradient(135deg, #0D9488 0%, #14B8A6 48%, #D4944C 100%);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #0D9488;

  /* Primary */
  --primary: #0D9488;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

  /* Font — unified serif system */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:    'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:    'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:         var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --radius-full: var(--radius-full);
}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Tab Bar — Premium Liquid Glass, absolute-positioned within .phone frame */
.tab-bar{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:360px;
  height:56px;
  z-index:100;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(48px) saturate(210%);
  -webkit-backdrop-filter:blur(48px) saturate(210%);
  border:0.5px solid rgba(255,255,255,0.45);
  border-radius:24px;
  box-shadow:
    inset 0 1.5px 3px rgba(255,255,255,0.60),
    inset 0 -0.5px 1px rgba(255,255,255,0.20),
    0 0 0 0.5px rgba(0,0,0,0.04),
    0 2px 10px rgba(0,0,0,0.06),
    0 12px 36px rgba(0,0,0,0.08);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 6px;
}
.tab-bar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(160deg,
    rgba(255,255,255,0.42) 0%,
    rgba(255,255,255,0.16) 20%,
    rgba(255,255,255,0.03) 40%,
    transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  padding:0.5px;
  pointer-events:none;
  z-index:1;
}
.tab-bar::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(320deg,
    transparent 60%,
    rgba(13,148,136,0.06) 80%,
    rgba(255,255,255,0.04) 100%);
  pointer-events:none;
  z-index:1;
}
.tab-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  width:68px;
  height:44px;
  border-radius:14px;
  color:var(--text-3);
  font-size:11px;
  font-weight:500;
  text-decoration:none;
  position:relative;
  transition:all .2s;
}
.tab-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.tab-item[data-active="true"]{
  color:var(--brand);
  font-weight:600;
}
.tab-item[data-active="true"]::before{
  content:"";
  position:absolute;
  width:54px;
  height:42px;
  border-radius:16px;
  background:rgba(13,148,136,0.16);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:0.5px solid rgba(13,148,136,0.30);
  box-shadow:
    inset 0 1px 3px rgba(255,255,255,0.55),
    inset 0 -0.5px 1px rgba(255,255,255,0.15),
    0 2px 10px rgba(13,148,136,0.20),
    0 0 0 0.5px rgba(13,148,136,0.08);
  z-index:0;
}
.tab-item[data-active="true"] svg{
  transform:scale(1.08);
  position:relative;
  z-index:1;
}

/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --phone-bg:#F2EDE8;
  --border-glass:0.5px solid rgba(255,255,255,0.60);
  --border-glass-soft:0.5px solid rgba(255,255,255,0.45);
  --icon-raise:5px 5px 10px var(--neu-dark),-5px -5px 10px var(--neu-light);

}

html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:var(--body-bg);letter-spacing:-0.01em}

/* ===== Phone Frame ===== */
.phone{position:relative;width:414px;min-height:896px;background:var(--phone-bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:82px}

.phone::after{content:'';position:absolute;bottom:0;left:0;right:0;height:260px;background:radial-gradient(ellipse 180px 120px at 20% 90%,rgba(13,148,136,.05) 0%,transparent 70%),radial-gradient(ellipse 160px 100px at 80% 85%,rgba(212,148,76,.05) 0%,transparent 70%);pointer-events:none;z-index:0}
.phone>*{position:relative;z-index:1}

/* ===== btn-neu-primary base (head only defines :active) ===== */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--brand-gradient);
  color:var(--text-inverse);
  border:0.5px solid rgba(255,255,255,0.40);
  border-radius:9999px;
  padding:10px 20px;font-size:14px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 4px 14px var(--brand-glow),inset 0 1px 1px rgba(255,255,255,0.30);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}

/* ===== Sub Header (status + back) ===== */
.sub-header{position:sticky;top:0;z-index:50;background:radial-gradient(ellipse 220px 160px at 78% 45%,rgba(212,148,76,.10) 0%,transparent 70%),radial-gradient(ellipse 180px 140px at 18% 75%,rgba(13,148,136,.10) 0%,transparent 70%),linear-gradient(135deg,rgba(13,148,136,.08) 0%,rgba(212,148,76,.06) 50%,rgba(13,148,136,.05) 100%); border-radius:0 0 28px 28px; overflow:hidden;}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 4px;font-size:13px;font-weight:600;color:var(--text-1)}
.status-icons{display:flex;align-items:center;gap:6px}
.status-icons svg{width:16px;height:16px;stroke:var(--text-1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back-row{display:flex;align-items:center;gap:8px;padding:4px 20px 12px}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.50);border:0.5px solid rgba(255,255,255,0.60);display:flex;align-items:center;justify-content:center;color:var(--text-1);cursor:pointer;flex-shrink:0;box-shadow:var(--neu-out-sm);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.back-btn:active{box-shadow:var(--neu-in);transform:scale(0.9)}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back-title{flex:1;font-size:18px;font-weight:700;color:var(--text-1);letter-spacing:-.2px;text-align:center}
.back-spacer{width:36px;flex-shrink:0}

/* ===== Section Title ===== */
.section-title{font-size:18px;font-weight:700;color:var(--text-1);padding:20px 24px 14px;letter-spacing:-.2px}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 12px}
.section-header .section-title{padding:0}
.section-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--brand);cursor:pointer;background:rgba(255,255,255,0.55);border:0.5px solid rgba(255,255,255,0.70);border-radius:9999px;font-family:var(--font);padding:6px 12px;box-shadow:var(--neu-out-sm);transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),background var(--dur) var(--ease)}
.section-link:active{box-shadow:var(--neu-in);transform:scale(0.94);background:rgba(255,255,255,0.40)}
.section-link svg{width:14px;height:14px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Online Service Cards ===== */
.online-card{display:flex;align-items:center;gap:14px;margin:16px 24px 12px;padding:16px;background:var(--surface-1);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:0.5px solid rgba(255,255,255,0.60);border-radius:22px;box-shadow:var(--neu-out-sm);transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease)}
.online-card:active{transform:scale(0.98);box-shadow:var(--neu-in)}
.online-icon{width:48px;height:48px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-inverse);box-shadow:var(--neu-out-sm)}
.online-icon svg{width:24px;height:24px;stroke:var(--text-inverse);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.online-icon-teal{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-mid) 100%);box-shadow:var(--neu-out-sm),0 4px 14px var(--brand-glow)}
.online-icon-amber{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-mid) 100%);box-shadow:var(--neu-out-sm),0 4px 14px var(--accent-glow)}
.online-info{flex:1;min-width:0}
.online-name{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-.01em;margin-bottom:4px}
.online-sub{font-size:12px;color:var(--text-2);line-height:1.5}
.hotline-num{font-size:19px;font-weight:700;color:var(--brand);letter-spacing:-.02em;margin-bottom:2px;font-variant-numeric:tabular-nums}
.btn-consult{flex-shrink:0}
.btn-call{flex-shrink:0;gap:6px}
.btn-call svg{width:14px;height:14px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Filter Pills ===== */
.pills{display:flex;gap:8px;padding:0 24px 14px}
.pill{flex-shrink:0;padding:8px 18px;border-radius:9999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease);border:none;font-family:var(--font);background:var(--bg-elevated);color:var(--text-2);box-shadow:var(--neu-out-sm)}
.pill:active{transform:scale(0.94);box-shadow:var(--neu-in)}
.pill-active{background:var(--brand-subtle);color:var(--brand);box-shadow:var(--neu-in),0 0 0 0.5px var(--brand-subtle)}

/* ===== Ticket Cards ===== */
.ticket-card{position:relative;margin:0 24px 12px;padding:16px;background:var(--surface-1);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:0.5px solid rgba(255,255,255,0.60);border-radius:20px;box-shadow:var(--neu-out-sm);cursor:pointer;transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease)}
.ticket-card:active{transform:scale(0.97);box-shadow:var(--neu-in)}
.ticket-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.type-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:9999px;letter-spacing:.02em}
.type-complaint{color:var(--orange);background:rgba(212,148,76,.07);border:0.5px solid rgba(212,148,76,.14)}
.type-refund{color:var(--blue);background:rgba(90,143,173,0.12);border:0.5px solid rgba(90,143,173,0.22)}
.type-claim{color:var(--red);background:rgba(196,83,58,0.12);border:0.5px solid rgba(196,83,58,0.22)}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:9999px}
.status-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.status-processing{color:var(--orange);background:rgba(212,148,76,0.10)}
.status-reply{color:var(--blue);background:rgba(90,143,173,0.10)}
.status-resolved{color:var(--green);background:rgba(91,140,90,0.10)}
.ticket-title{font-size:15px;font-weight:600;color:var(--text-1);letter-spacing:-.01em;margin-bottom:12px}
.ticket-foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.ticket-no{font-variant-numeric:tabular-nums;color:var(--text-2)}
.ticket-dot{color:var(--text-3)}
.ticket-time{color:var(--text-3)}
.ticket-view{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--brand);font-weight:600}
.ticket-view svg{width:12px;height:12px;stroke:var(--brand);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ===== FAQ Card ===== */
.faq-card{margin:0 24px;background:rgba(255,255,255,0.52);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,0.70);border-radius:var(--radius-md);box-shadow:var(--neu-out-md);overflow:hidden;position:relative}
.faq-card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none}
.faq-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;position:relative;cursor:pointer;transition:transform var(--dur) var(--ease),background 0.15s ease}
.faq-item:active{transform:scale(0.98);background:var(--fill)}
.faq-item:not(:last-child)::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:0.5px;background:var(--sep)}
.faq-q{flex:1;font-size:15px;color:var(--text-1);font-weight:500;letter-spacing:-.01em}
.faq-arrow{width:16px;height:16px;fill:none;stroke:var(--text-3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform var(--dur) var(--ease)}

/* ===== Bottom Bar ===== */
.bottom-bar{position:sticky;bottom:0;left:0;right:0;z-index:50;padding:14px 24px 24px;background:linear-gradient(180deg,rgba(242,237,232,0) 0%,rgba(242,237,232,0.88) 35%,rgba(242,237,232,0.96) 100%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn-submit{width:100%;height:50px;font-size:16px;border-radius:18px;background:var(--brand-gradient)}

@media (prefers-reduced-motion:reduce){
  .back-btn,.online-card,.pill,.ticket-card,.faq-item,.btn-neu-primary,.btn-neu-secondary,.section-link,.faq-arrow{transition:none}
}
</style>

</body>
