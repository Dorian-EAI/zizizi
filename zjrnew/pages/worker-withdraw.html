    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Worker (Blue) */
  --brand: #2D6CDF;
  --brand-dark: #2456B8;
  --brand-mid: #5A8EE8;
  --brand-light: #DCE8FB;
  --brand-glow: rgba(45, 108, 223, 0.28);
  --brand-subtle: rgba(45, 108, 223, 0.08);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #2D6CDF;

  /* Primary */
  --primary: #2D6CDF;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

    /* Font — 统一衬线系统 */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font: var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --font-sans: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-serif: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --radius-full: var(--radius-full);}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

<div class="phone" data-dom-id="page-worker-withdraw">

  <!-- ===== TOP NAV BAR (sticky) ===== -->

    <button class="nav-icon-btn" data-dom-id="back-btn" aria-label="返回">

      <div class="status-top-bar"></div>

          <button class="balance-all-btn" data-dom-id="withdraw-all-top" aria-label="全部提现">全部提现</button>
        </div>
        <div class="balance-amount mono">&yen;1,286.50</div>
        <div class="balance-meta">
          <span class="bm-item">冻结中 &yen;120.00</span>
          <span class="bm-dot">&middot;</span>
          <span class="bm-item">累计提现 &yen;8,600.00</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== WITHDRAW AMOUNT CARD ===== -->
  <section class="section">
    <div class="glass-neu-card amount-card">
      <div class="card-title">提现金额</div>
      <div class="amount-input-row">
        <span class="amount-currency">&yen;</span>
        <input class="amount-input mono" type="text" inputmode="decimal" placeholder="0.00" data-dom-id="withdraw-amount" aria-label="提现金额">
      </div>
      <div class="amount-divider"></div>
      <div class="amount-foot">
        <span class="amount-tip">最低提现 &yen;10.00</span>
        <button class="amount-all-link" data-dom-id="withdraw-all-inline" aria-label="全部提现">全部提现</button>
      </div>
    </div>
  </section>

  <!-- ===== PAYMENT METHOD CARD ===== -->
  <section class="section">
    <div class="glass-neu-card method-card">
      <div class="card-title">到账方式</div>
      <div class="method-list">
        <!-- Bank card (selected) -->
        <label class="method-row method-row-selected" data-dom-id="method-bank">
          <div class="method-icon method-icon-bank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10h18"/>
              <path d="M5 10v8M9 10v8M15 10v8M19 10v8"/>
              <path d="M2 20h20"/>
              <path d="M12 2 2 7h20z"/>
            </svg>
          </div>
          <div class="method-info">
            <div class="method-name">招商银行储蓄卡</div>
            <div class="method-desc mono">****8866</div>
          </div>
          <span class="method-radio method-radio-on" aria-hidden="true">
            <span class="method-radio-dot"></span>
          </span>
          <input type="radio" name="method" class="sr-only" checked>
        </label>
        <div class="method-change-row">
          <button class="method-change-link" data-dom-id="change-bank" aria-label="更换">更换</button>
        </div>
        <div class="method-divider"></div>
        <!-- WeChat (unselected) -->
        <label class="method-row" data-dom-id="method-wechat">
          <div class="method-icon method-icon-wechat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

          </div>
          <span class="method-radio" aria-hidden="true"></span>
          <input type="radio" name="method" class="sr-only">
        </label>
      </div>
    </div>
  </section>

  <!-- ===== WITHDRAW TIPS CARD ===== -->

/* ===== Phone Frame (活力渐变布局: 无圆角/无overflow) ===== */
.phone{position:relative;width:414px;min-height:896px;background:var(--bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:82px}

/* Mono / Tabular nums */
.mono{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

/* ===== Top Nav Bar (sticky) ===== */

  background:var(--bg-elevated);
  box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);
  display:flex;align-items:center;justify-content:center;

/* ===== Sections ===== */
.section{padding:0 20px;margin-top:16px;position:relative;z-index:2}
.section:first-of-type{margin-top:18px}

/* ===== Glass + Neumorphic Card ===== */
.glass-neu-card{
  background:rgba(255,255,255,0.52);

  position:relative;overflow:hidden;
}
.glass-neu-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);

/* ===== Card Title ===== */
.card-title{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em;margin-bottom:14px}

/* ===== Brand gradient top bar (reused from status-top-bar) ===== */
.status-top-bar{

/* ===== Balance Card ===== */
.balance-card{padding:0}

.balance-label{font-size:13px;color:var(--text-2);font-weight:600;letter-spacing:0.01em}

  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.55);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.70);border-radius:9999px;
  font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;
  padding:6px 12px;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),background var(--dur) var(--ease);
}

  text-shadow:0 1px 0 rgba(255,255,255,0.4);
}
.balance-meta{
  display:flex;align-items:center;gap:8px;margin-top:10px;
  font-size:12px;color:var(--text-2);font-weight:500;
}
.bm-dot{color:var(--text-3)}

/* ===== Amount Input Card ===== */
.amount-card{padding:18px}
.amount-input-row{
  display:flex;align-items:center;gap:8px;
  padding:6px 0 10px;
}

  line-height:1;letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums;
}
.amount-input{
  flex:1;min-width:0;
  background:transparent;border:none;outline:none;
  font-family:var(--font);font-size:40px;font-weight:800;
  color:var(--brand);letter-spacing:-0.02em;line-height:1;
  font-variant-numeric:tabular-nums;
  padding:0;
}
.amount-input::placeholder{color:var(--text-3);font-weight:700}
.amount-divider{height:0.5px;background:var(--sep);margin:2px 0 12px}

  display:flex;align-items:center;justify-content:space-between;
}
.amount-tip{font-size:12px;color:var(--text-2);font-weight:500}
.amount-all-link{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.55);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.70);border-radius:9999px;
  font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;
  padding:6px 12px;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),background var(--dur) var(--ease);
}

/* ===== Payment Method Card ===== */
.method-card{padding:18px}
.method-list{display:flex;flex-direction:column}

}

/* ===== Records Link ===== */
.section-link{margin-top:14px}

  width:100%;

  background:rgba(255,255,255,0.55);color:var(--text-2);

}

/* ===== Reduced Motion ===== */
