<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自家人居家维修 · 玻璃新拟态 · 补差价</title>
    <link rel="stylesheet" href="../assets/fonts.css">
    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#0D9488;--brand-dark:#0A7A70;--brand-mid:#14B8A6;--brand-light:#CCFBF1;
  --brand-glow:rgba(13,148,136,0.28);--brand-subtle:rgba(13,148,136,0.08);
  --brand-gradient:linear-gradient(135deg,#0D9488 0%,#14B8A6 50%,#D4944C 100%);
  --accent:#D4944C;--accent-dark:#A0723C;--accent-light:#F5E6D0;
  --bg:#F2EDE8;--bg-elevated:#F7F3EF;
  --neu-light:#FFF8F2;--neu-dark:#DDD6CE;
  --text-1:#2C2824;--text-2:#8B8178;--text-3:#B5ADA5;--text-inverse:#FFFFFF;
  --sep:rgba(44,40,36,0.06);
  --green:#5B8C5A;--red:#C4533A;--orange:#D4944C;--blue:#5A8FAD;
  --r:1.2rem;--r-lg:1.6rem;--r-sm:0.75rem;--r-pill:9999px;
  --font-display:'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:var(--font-body);
  --neu-out-sm:6px 6px 14px var(--neu-dark),-6px -6px 14px var(--neu-light),0 4px 16px rgba(0,0,0,0.04);
  --neu-out-md:8px 8px 18px var(--neu-dark),-8px -8px 18px var(--neu-light),0 6px 24px rgba(0,0,0,0.05);
  --neu-in:inset 4px 4px 8px var(--neu-dark),inset -4px -4px 8px var(--neu-light);
  --spring:cubic-bezier(0.175,0.885,0.32,1.275);--ease:cubic-bezier(0.25,0.46,0.45,0.94);--dur:0.2s;
}
html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:#E8E4DF;letter-spacing:-0.01em}

.phone{position:relative;width:414px;min-height:896px;background:var(--bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:100px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

/* ===== Top Nav ===== */
.nav-bar{background:radial-gradient(ellipse 220px 160px at 78% 45%,rgba(212,148,76,.14) 0%,transparent 70%),radial-gradient(ellipse 180px 140px at 18% 75%,rgba(13,148,136,.16) 0%,transparent 70%),linear-gradient(135deg,rgba(13,148,136,.14) 0%,rgba(212,148,76,.08) 50%,rgba(13,148,136,.06) 100%);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;padding-top:max(18px,env(safe-area-inset-top));border-radius:0 0 28px 28px;overflow:hidden}
.nav-icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--bg-elevated);box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);display:flex;align-items:center;justify-content:center;color:var(--text-1);cursor:pointer;flex-shrink:0;transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease)}
.nav-icon-btn:active{box-shadow:var(--neu-in);transform:scale(0.94)}
.nav-title{font-size:17px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em}

/* ===== Section ===== */
.section{padding:16px 20px 0}
.section-title{font-size:15px;font-weight:700;color:var(--text-1);margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* ===== Glass Card ===== */
.glass-card{background:rgba(255,255,255,0.52);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-radius:var(--r-lg);border:0.5px solid rgba(255,255,255,0.60);box-shadow:var(--neu-out-md);padding:20px;position:relative}
.glass-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.80),transparent);pointer-events:none}

/* ===== Status Banner ===== */
.status-banner{display:flex;align-items:center;gap:12px;padding:16px 20px;margin:16px 20px 0;background:linear-gradient(135deg,rgba(212,148,76,0.15),rgba(212,148,76,0.08));border-radius:var(--r-md);border:0.5px solid rgba(212,148,76,0.30)}
.status-icon{width:40px;height:40px;border-radius:12px;background:rgba(212,148,76,0.20);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.status-text{flex:1}
.status-title{font-size:14px;font-weight:600;color:var(--accent-dark);margin-bottom:2px}
.status-desc{font-size:12px;color:var(--text-2)}

/* ===== Worker Info ===== */
.worker-row{display:flex;align-items:center;gap:12px}
.worker-avatar{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-mid));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0;box-shadow:var(--neu-out-sm)}
.worker-info{flex:1}
.worker-name{font-size:15px;font-weight:600;margin-bottom:2px}
.worker-service{font-size:12px;color:var(--text-2)}

/* ===== Amount Display ===== */
.amount-section{text-align:center;padding:24px 0}
.amount-label{font-size:13px;color:var(--text-2);margin-bottom:8px}
.amount-value{font-size:48px;font-weight:700;font-family:var(--font-display);color:var(--accent);letter-spacing:-0.03em;line-height:1.1}
.amount-value .currency{font-size:24px;vertical-align:top;margin-right:4px;font-weight:600}
.amount-reason{font-size:12px;color:var(--text-2);margin-top:8px}

/* ===== Fee Breakdown ===== */
.fee-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--sep)}
.fee-row:last-child{border-bottom:none}
.fee-label{font-size:13.5px;color:var(--text-2)}
.fee-value{font-size:13.5px;color:var(--text-1);font-weight:500}
.fee-total{padding-top:12px;border-top:1px dashed var(--sep);margin-top:4px}
.fee-total .fee-label{font-weight:600;color:var(--text-1);font-size:14px}
.fee-total .fee-value{font-size:20px;font-weight:700;color:var(--brand);font-family:var(--font-display)}

/* ===== Reason Section ===== */
.reason-box{padding:14px 16px;background:var(--bg-elevated);border-radius:var(--r-md);box-shadow:var(--neu-in);font-size:13.5px;color:var(--text-1);line-height:1.6}

/* ===== Photo Evidence ===== */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.photo-item{aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:var(--neu-out-sm)}
.photo-item div{width:100%;height:100%}

/* ===== Action Buttons ===== */
.action-buttons{display:flex;gap:12px;padding:16px 20px}
.action-btn{flex:1;padding:14px;border-radius:9999px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all var(--dur) var(--spring)}
.action-btn.reject{background:rgba(255,255,255,0.52);color:var(--text-2);border:0.5px solid rgba(255,255,255,0.60);box-shadow:var(--neu-out-sm)}
.action-btn.confirm{background:var(--brand-gradient);color:#fff;box-shadow:var(--neu-out-sm),0 4px 14px var(--brand-glow)}
.action-btn:active{transform:scale(0.96);box-shadow:var(--neu-in)}

/* ===== Bottom Bar ===== */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:414px;z-index:100;padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,0.72);backdrop-filter:blur(24px) saturate(160%);border-top:0.5px solid rgba(255,255,255,0.60);box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.bottom-btn{width:100%;padding:16px;background:var(--brand-gradient);color:#fff;font-size:16px;font-weight:700;border:none;border-radius:9999px;cursor:pointer;box-shadow:var(--neu-out-sm),0 4px 14px var(--brand-glow);transition:all var(--dur) var(--spring)}
.bottom-btn:active{transform:scale(0.98);box-shadow:var(--neu-in)}
.bottom-btn.disabled{background:var(--neu-dark);box-shadow:none;color:var(--text-3);cursor:not-allowed}

/* ===== Timeline ===== */
.timeline-item{display:flex;gap:12px;padding-bottom:20px;position:relative}
.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--sep)}
.timeline-item:last-child::before{display:none}
.timeline-dot{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1;box-shadow:0 2px 8px var(--brand-glow)}
.timeline-dot.done{background:var(--green);box-shadow:0 2px 8px rgba(91,140,90,0.30)}
.timeline-dot.pending{background:var(--bg-elevated);box-shadow:var(--neu-out-sm);color:var(--text-3)}
.timeline-content{flex:1;padding-top:2px}
.timeline-title{font-size:14px;font-weight:500;margin-bottom:2px}
.timeline-time{font-size:12px;color:var(--text-2)}
    </style>
</head>
<body>
<div class="phone" data-dom-id="page-client-price-adjust">

  <!-- ===== TOP NAV ===== -->
  <header class="nav-bar">
    <button class="nav-icon-btn" data-dom-id="back-btn" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 class="nav-title">补差价申请</h1>
    <button class="nav-icon-btn" data-dom-id="help-btn" aria-label="帮助">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
    </button>
  </header>

  <!-- ===== STATUS BANNER ===== -->
  <div class="status-banner" data-dom-id="status-banner">
    <div class="status-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    </div>
    <div class="status-text">
      <div class="status-title">师傅申请补差价 &yen;50.00</div>
      <div class="status-desc">请在24小时内确认，超时自动同意</div>
    </div>
  </div>

  <!-- ===== AMOUNT ===== -->
  <section class="section">
    <div class="glass-card">
      <div class="amount-section" data-dom-id="amount-display">
        <div class="amount-label">申请补差价金额</div>
        <div class="amount-value mono"><span class="currency">&yen;</span>50.00</div>
        <div class="amount-reason">订单原金额 &yen;158.00 → 调整后 &yen;208.00</div>
      </div>
    </div>
  </section>

  <!-- ===== WORKER INFO ===== -->
  <section class="section">
    <div class="section-title">申请人</div>
    <div class="glass-card">
      <div class="worker-row" data-dom-id="worker-info">
        <div class="worker-avatar">张</div>
        <div class="worker-info">
          <div class="worker-name">张师傅</div>
          <div class="worker-service">水管维修 · 从业8年 · 评分4.9</div>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>
  </section>

  <!-- ===== REASON ===== -->
  <section class="section">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      差价原因
    </div>
    <div class="glass-card">
      <div class="reason-box" data-dom-id="adjust-reason">
        维修过程中发现水管老化严重，需要更换额外的配件（弯头2个 + 连接管1米），材料费用增加。已征得您的口头同意，现申请补差价50元。
      </div>
    </div>
  </section>

  <!-- ===== EVIDENCE PHOTOS ===== -->
  <section class="section">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      凭证照片
    </div>
    <div class="glass-card">
      <div class="photo-grid" data-dom-id="evidence-photos">
        <div class="photo-item"><div style="background:linear-gradient(135deg,#d4e8e4,#b0d0c8)"></div></div>
        <div class="photo-item"><div style="background:linear-gradient(135deg,#e0d5c8,#c9b8a8)"></div></div>
        <div class="photo-item"><div style="background:linear-gradient(135deg,#fde68a,#fcd34d)"></div></div>
      </div>
    </div>
  </section>

  <!-- ===== FEE BREAKDOWN ===== -->
  <section class="section">
    <div class="section-title">费用明细</div>
    <div class="glass-card" data-dom-id="fee-breakdown">
      <div class="fee-row">
        <span class="fee-label">原始服务费</span>
        <span class="fee-value mono">&yen;158.00</span>
      </div>
      <div class="fee-row">
        <span class="fee-label">上门费</span>
        <span class="fee-value mono">&yen;20.00</span>
      </div>
      <div class="fee-row">
        <span class="fee-label">材料配件费（新增）</span>
        <span class="fee-value" style="color:var(--accent)" class="mono">+ &yen;50.00</span>
      </div>
      <div class="fee-row fee-total">
        <span class="fee-label">调整后应付</span>
        <span class="fee-value mono">&yen;208.00</span>
      </div>
    </div>
  </section>

  <!-- ===== ACTION BUTTONS ===== -->
  <div class="action-buttons">
    <button class="action-btn reject" data-dom-id="btn-reject">拒绝申请</button>
    <button class="action-btn confirm" data-dom-id="btn-confirm">同意并支付</button>
  </div>

</div>
</body>
</html>
