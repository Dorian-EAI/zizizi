    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Client (Teal) */
  --brand: #0D9488;
  --brand-dark: #0A7A70;
  --brand-mid: #14B8A6;
  --brand-light: #CCFBF1;
  --brand-glow: rgba(13, 148, 136, 0.24);
  --brand-subtle: rgba(13, 148, 136, 0.10);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #0D9488;

  /* Primary */
  --primary: #0D9488;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

    /* Font — 统一衬线系统 */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font: var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --font-sans: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-serif: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --radius-full: var(--radius-full);}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

    </style>

.mono{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

/* ===== Top Nav Bar (sticky) ===== */
.nav-bar{background:radial-gradient(ellipse 220px 160px at 78% 45%,rgba(212,148,76,.14) 0%,transparent 70%),radial-gradient(ellipse 180px 140px at 18% 75%,rgba(13,148,136,.16) 0%,transparent 70%),linear-gradient(135deg,rgba(13,148,136,.14) 0%,rgba(212,148,76,.08) 50%,rgba(13,148,136,.06) 100%);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;padding-top:max(18px,env(safe-area-inset-top)); border-radius:0 0 28px 28px; overflow:hidden;}
.nav-icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--bg-elevated);
  box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-1);cursor:pointer;flex-shrink:0;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.nav-icon-btn:active{box-shadow:var(--neu-in);transform:scale(0.94)}
.nav-icon-btn svg{width:22px;height:22px}
.nav-title{font-size:17px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em}

/* Nav Text Button (right side) */
.nav-text-btn{
  display:inline-flex;align-items:center;gap:5px;
  min-width:44px;height:40px;padding:0 12px;
  background:var(--bg-elevated);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:var(--r-pill);
  color:var(--brand);font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;flex-shrink:0;
  box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.nav-text-btn:active{box-shadow:var(--neu-in);transform:scale(0.94)}
.nav-text-btn svg{width:16px;height:16px}

/* ===== Sections ===== */
.section{padding:0 20px;margin-top:16px;position:relative;z-index:2}
.section:first-of-type{margin-top:18px}

/* ===== Glass + Neumorphic Card ===== */
.glass-neu-card{
  background:rgba(255,255,255,0.52);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,0.70);
  border-radius:var(--r-lg);
  box-shadow:var(--neu-out-md),0 6px 28px rgba(0,0,0,0.06),0 2px 8px rgba(13,148,136,0.04),0 0 0 1px rgba(44,40,36,0.05);
  position:relative;overflow:hidden;
}
.glass-neu-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none;
}

/* ===== Card Title ===== */
.card-title{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em;margin-bottom:14px}

/* ===== Bottom Fixed Action Bar (kept for parity, unused on this browse page) ===== */
.action-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:414px;
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;padding-bottom:max(14px,env(safe-area-inset-bottom));
  background:rgba(242,237,232,0.88);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border-top:0.5px solid rgba(255,255,255,0.55);
  box-shadow:0 -4px 20px rgba(0,0,0,0.05);
  z-index:60;
}

/* ============================================================
   ===== Coupon Page Specific Styles =====
   ============================================================ */

/* ===== Summary Card ===== */
.summary-card{
  display:flex;align-items:center;
  padding:18px 18px;gap:8px;
}
.summary-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.summary-num{
  font-size:28px;font-weight:800;color:var(--brand);
  letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:baseline;
}
.summary-unit{font-size:13px;font-weight:600;margin-left:2px;opacity:0.85}
.summary-label{font-size:12px;color:var(--text-2);font-weight:500;letter-spacing:0.01em}
.summary-divider{width:1px;height:38px;background:var(--sep);flex-shrink:0}

/* ===== Segmented Tabs (neu inset) ===== */
.segmented-tabs{
  display:flex;gap:4px;
  padding:5px;
  background:var(--bg-elevated);
  border-radius:var(--r-pill);
  box-shadow:var(--neu-in),inset 0 1px 1px rgba(255,255,255,0.35);
}
.seg-tab{
  flex:1;height:38px;border:none;
  background:transparent;color:var(--text-2);
  font-size:13.5px;font-weight:600;font-family:var(--font);
  border-radius:var(--r-pill);cursor:pointer;
  transition:all var(--dur) var(--ease);
  display:inline-flex;align-items:center;justify-content:center;
}
.seg-tab.active{
  background:var(--brand);color:var(--text-inverse);
  box-shadow:var(--neu-out-sm),0 2px 10px var(--brand-glow),inset 0 1px 1px rgba(255,255,255,0.25);
  letter-spacing:0.01em;
}
.seg-tab:not(.active):active{transform:scale(0.95);color:var(--brand)}

/* ===== List Section Title ===== */
.list-section-title{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:var(--text-2);
  letter-spacing:0.02em;margin-bottom:14px;padding:0 2px;
}
.list-section-title::before{
  content:'';width:3px;height:14px;
  background:var(--brand);border-radius:2px;
  box-shadow:0 0 6px var(--brand-glow);
}

/* ===== Coupon List ===== */
.coupon-list{display:flex;flex-direction:column;gap:16px}

/* ===== Coupon Ticket Card ===== */
.coupon-card{
  display:flex;align-items:stretch;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,0.70);
  border-radius:var(--r-md);
  box-shadow:var(--neu-out-sm),0 6px 22px rgba(0,0,0,0.05),0 0 0 1px rgba(44,40,36,0.04);
  position:relative;
  overflow:visible;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.coupon-card:active{transform:scale(0.985)}
.coupon-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none;z-index:1;
}

/* Amount area (left, brand gradient) */
.coupon-amount{
  flex:0 0 110px;
  background:var(--brand-gradient);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;
  padding:18px 8px;
  color:var(--text-inverse);
  border-radius:calc(var(--r-md) - 1px) 0 0 calc(var(--r-md) - 1px);
  position:relative;z-index:2;
  box-shadow:inset -1px 0 0 rgba(255,255,255,0.18);
}
.coupon-amount::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(165deg,rgba(255,255,255,0.28) 0%,transparent 42%);
  pointer-events:none;
}
.coupon-amount-val{display:inline-flex;align-items:baseline;justify-content:center}
.coupon-amount .cur{font-size:15px;font-weight:700;opacity:0.92;margin-right:1px}
.coupon-amount .num{font-size:40px;font-weight:800;line-height:1;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.coupon-amount-threshold{
  font-size:10.5px;font-weight:600;letter-spacing:0.01em;
  white-space:nowrap;
  background:rgba(255,255,255,0.20);
  padding:2px 9px;border-radius:var(--r-pill);
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.22);
}

/* Divider with circular notches (ticket perforation) */
.coupon-divider{
  position:relative;
  width:1.5px;
  align-self:stretch;
  background-image:linear-gradient(to bottom,var(--sep) 55%,transparent 55%);
  background-size:1.5px 8px;
  background-repeat:repeat-y;
  background-position:center;
  z-index:3;
  opacity:0.9;
}
/* Top & bottom circular notches (punch holes) on the divider */
.coupon-divider::before,
.coupon-divider::after{
  content:'';
  position:absolute;
  left:50%;
  width:16px;height:16px;border-radius:50%;
  background:var(--bg);
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.10),inset 0 -1px 1px rgba(255,255,255,0.4);
  transform:translateX(-50%);
}
.coupon-divider::before{top:-8px}
.coupon-divider::after{bottom:-8px}

/* Info area (right) */
.coupon-info{
  flex:1;min-width:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:14px 16px;gap:5px;
  position:relative;z-index:2;
}
.coupon-name{
  font-size:15px;font-weight:700;color:var(--text-1);
  letter-spacing:-0.01em;line-height:1.3;
}
.coupon-validity{
  font-size:11.5px;color:var(--text-2);font-weight:500;
  display:inline-flex;align-items:center;gap:4px;
}
.coupon-validity::before{
  content:'';width:5px;height:5px;border-radius:50%;background:var(--text-3);flex-shrink:0;
}
.coupon-use-btn{
  align-self:flex-start;
  margin-top:6px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:var(--r-pill);
  padding:6px 15px;font-size:12px;font-weight:700;font-family:var(--font);
  cursor:pointer;letter-spacing:0.02em;
  box-shadow:0 2px 8px var(--brand-glow),inset 0 1px 1px rgba(255,255,255,0.25);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.coupon-use-btn:active{transform:scale(0.93);box-shadow:var(--neu-in)}

/* Used coupons (grayed out, non-interactive) */
.coupon-card.coupon-used{opacity:0.55;pointer-events:none;filter:grayscale(0.35)}
.coupon-card.coupon-used .coupon-amount{
  background:linear-gradient(135deg,#B5ADA5 0%,#8B8178 60%,#6F665E 100%);
}
.coupon-used-badge{
  align-self:flex-start;
  margin-top:6px;
  display:inline-flex;align-items:center;gap:3px;
  font-size:11.5px;font-weight:700;color:var(--text-3);
  background:var(--fill);border:0.5px solid var(--sep);
  padding:5px 10px;border-radius:var(--r-pill);
  letter-spacing:0.02em;
}
.coupon-used-badge svg{width:13px;height:13px}

/* ===== Foot Note ===== */
.coupon-foot-note{
  text-align:center;font-size:11.5px;color:var(--text-3);
  line-height:1.6;padding:14px 40px 4px;font-weight:500;
  letter-spacing:0.01em;position:relative;z-index:2;
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
}
