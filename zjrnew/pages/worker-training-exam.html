<head>

    <title>自家人居家维修 · 玻璃新拟态 · 在线考试</title>
    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Worker (Blue) */
  --brand: #2D6CDF;
  --brand-dark: #2456B8;
  --brand-mid: #5A8EE8;
  --brand-light: #DCE8FB;
  --brand-glow: rgba(45, 108, 223, 0.18);
  --brand-subtle: rgba(45, 108, 223, 0.08);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #2D6CDF;

  /* Primary */
  --primary: #2D6CDF;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

  /* Font — unified serif system */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:    'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:    'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:         var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --radius-full: var(--radius-full);
}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Tab Bar — Premium Liquid Glass, absolute-positioned within .phone frame */
.tab-bar{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:360px;
  height:56px;
  z-index:100;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(48px) saturate(210%);
  -webkit-backdrop-filter:blur(48px) saturate(210%);
  border:0.5px solid rgba(255,255,255,0.45);
  border-radius:24px;
  box-shadow:
    inset 0 1.5px 3px rgba(255,255,255,0.60),
    inset 0 -0.5px 1px rgba(255,255,255,0.20),
    0 0 0 0.5px rgba(0,0,0,0.04),
    0 2px 10px rgba(0,0,0,0.06),
    0 12px 36px rgba(0,0,0,0.08);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 6px;
}
.tab-bar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(160deg,
    rgba(255,255,255,0.42) 0%,
    rgba(255,255,255,0.16) 20%,
    rgba(255,255,255,0.03) 40%,
    transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  padding:0.5px;
  pointer-events:none;
  z-index:1;
}
.tab-bar::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(320deg,
    transparent 60%,
    rgba(13,148,136,0.06) 80%,
    rgba(255,255,255,0.04) 100%);
  pointer-events:none;
  z-index:1;
}
.tab-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  width:68px;
  height:44px;
  border-radius:14px;
  color:var(--text-3);
  font-size:11px;
  font-weight:500;
  text-decoration:none;
  position:relative;
  transition:all .2s;
}
.tab-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.tab-item[data-active="true"]{
  color:var(--brand);
  font-weight:600;
}
.tab-item[data-active="true"]::before{
  content:"";
  position:absolute;
  width:54px;
  height:42px;
  border-radius:16px;
  background:rgba(13,148,136,0.16);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:0.5px solid rgba(13,148,136,0.30);
  box-shadow:
    inset 0 1px 3px rgba(255,255,255,0.55),
    inset 0 -0.5px 1px rgba(255,255,255,0.15),
    0 2px 10px rgba(13,148,136,0.20),
    0 0 0 0.5px rgba(13,148,136,0.08);
  z-index:0;
}
.tab-item[data-active="true"] svg{
  transform:scale(1.08);
  position:relative;
  z-index:1;
}

/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

<body>
<div class="phone" data-dom-id="page-worker-training-exam">

  <!-- ===== 返回栏 + 标题 ===== -->
  <header class="exam-hero">
    <div class="exam-nav">
      <button class="back-btn" data-dom-id="training-exam-back" data-action="confirm-exit-exam" data-target-page="page-worker-training" type="button" aria-label="返回，确认退出？退出将不保存进度" title="确认退出？退出将不保存进度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="exam-nav-title-block">
        <h1 class="exam-nav-title">家电维修 · 考试</h1>
        <p class="exam-nav-sub">在线考试</p>
      </div>
      <button class="withdraw-circle" data-dom-id="answer-sheet" data-action="show-answer-sheet" aria-label="打开答题卡">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="6" height="6" rx="1"></rect>
          <rect x="14" y="4" width="6" height="6" rx="1"></rect>
          <rect x="4" y="14" width="6" height="6" rx="1"></rect>
          <rect x="14" y="14" width="6" height="6" rx="1"></rect>
        </svg>
      </button>
    </div>
    <div class="exit-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>退出将不保存进度</span>
    </div>
  </header>

  <!-- ===== 考试进度条卡 ===== -->
  <div class="section exam-progress-section">
    <div class="card exam-progress-card" data-dom-id="exam-progress">
      <div class="progress-top">
        <span class="progress-label">第 <em>3</em> / 10 题</span>
        <span class="progress-timer" data-dom-id="exam-timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>08:42</span>
        </span>
      </div>
      <div class="progress-bar-wrap" data-dom-id="exam-progress-bar">
        <div class="progress-bar" style="width:30%"></div>
      </div>
    </div>
  </div>

  <!-- ===== 题目卡 ===== -->
  <div class="section">
    <div class="card question-card" data-dom-id="question-card">
      <div class="question-head">
        <span class="question-type-badge" data-dom-id="question-type">单选题</span>
        <span class="question-no">第 3 题 · 共 10 题</span>
      </div>
      <p class="question-stem">空调不制冷，以下可能的原因不包括？</p>

      <div class="option-list">
        <button class="option-item" data-dom-id="training-exam-option-a" data-action="select-exam-option" type="button">
          <span class="option-letter">A</span>
          <span class="option-text">制冷剂不足</span>
        </button>
        <button class="option-item selected" data-dom-id="training-exam-option-b" data-action="select-exam-option" type="button" aria-pressed="true">
          <span class="option-letter">B</span>
          <span class="option-text">室内机过滤网积灰</span>
          <svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
        <button class="option-item" data-dom-id="training-exam-option-c" data-action="select-exam-option" type="button">
          <span class="option-letter">C</span>
          <span class="option-text">压缩机故障</span>
        </button>
        <button class="option-item" data-dom-id="training-exam-option-d" data-action="select-exam-option" type="button">
          <span class="option-letter">D</span>
          <span class="option-text">冷凝器散热不良</span>
        </button>
      </div>

      <p class="question-foot">选择最符合题意的答案</p>
    </div>
  </div>

  <!-- ===== 答题卡 ===== -->
  <div class="section">
    <div class="section-title">
      <span>答题卡</span>
      <span class="more">已答 2 / 10</span>
    </div>
    <div class="card answer-sheet-card">
      <div class="answer-grid" data-dom-id="training-exam-answer-grid">
        <button class="ans-cell answered" data-dom-id="training-exam-answer-1" data-action="jump-exam-question" type="button">1</button>
        <button class="ans-cell answered" data-dom-id="training-exam-answer-2" data-action="jump-exam-question" type="button">2</button>
        <button class="ans-cell current" data-dom-id="training-exam-answer-3" data-action="jump-exam-question" type="button" aria-current="true">3</button>
        <button class="ans-cell" data-dom-id="training-exam-answer-4" data-action="jump-exam-question" type="button">4</button>
        <button class="ans-cell" data-dom-id="training-exam-answer-5" data-action="jump-exam-question" type="button">5</button>
        <button class="ans-cell" data-dom-id="training-exam-answer-6" data-action="jump-exam-question" type="button">6</button>
        <button class="ans-cell" data-dom-id="training-exam-answer-7" data-action="jump-exam-question" type="button">7</button>
        <button class="ans-cell" data-dom-id="training-exam-answer-8" data-action="jump-exam-question" type="button">8</button>
        <button class="ans-cell" data-dom-id="training-exam-answer-9" data-action="jump-exam-question" type="button">9</button>
        <button class="ans-cell" data-dom-id="training-exam-answer-10" data-action="jump-exam-question" type="button">10</button>
      </div>
      <div class="answer-legend">
        <span class="legend-item"><i class="dot answered"></i>已答</span>
        <span class="legend-item"><i class="dot current"></i>当前</span>
        <span class="legend-item"><i class="dot"></i>未答</span>
      </div>
    </div>
  </div>

  <!-- ===== 底部固定双按钮 ===== -->
  <div class="exam-footer">
    <button class="btn-neu-ghost exam-btn-prev" data-dom-id="btn-prev" data-action="previous-question" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span>上一题</span>
    </button>
    <button class="btn-neu-primary exam-btn-next" data-dom-id="btn-next" data-action="next-question" type="button">
      <span>下一题</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

</div>

    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#2D6CDF;--brand-dark:#2456B8;--brand-light:#DCE8FB;
  --brand-glow:rgba(45,108,223,0.18);--brand-subtle:rgba(45,108,223,0.08);
  --brand-gradient:linear-gradient(135deg,#2D6CDF 0%,#5A8EE8 48%,#D4944C 100%);
  --accent:#D4944C;--accent-light:#F5E6D0;--accent-glow:rgba(212,148,76,0.16);
  --bg:#F2EDE8;--bg-elevated:#F7F3EF;
  --neu-light:#FFF8F2;--neu-dark:#DDD6CE;
  --text-1:#2C2824;--text-2:#8B8178;--text-3:#B5ADA5;--text-inverse:#FFFFFF;
  --sep:rgba(44,40,36,0.06);--fill:rgba(44,40,36,0.04);
  --green:#5B8C5A;--red:#C4533A;--orange:#D4944C;--blue:#5A8FAD;
  --r:1.2rem;--r-lg:1.6rem;--r-sm:0.75rem;--r-pill:9999px;--r-tab:24px;
  /* Font */--font-display:'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:var(--font-body);
  --neu-out-sm:5px 5px 12px var(--neu-dark),-5px -5px 12px var(--neu-light);
  --neu-out-md:8px 8px 18px var(--neu-dark),-8px -8px 18px var(--neu-light);
  --neu-out-lg:10px 10px 24px var(--neu-dark),-10px -10px 24px var(--neu-light);
  --neu-in:inset 4px 4px 8px var(--neu-dark),inset -4px -4px 8px var(--neu-light);
  --neu-in-deep:inset 5px 5px 10px var(--neu-dark),inset -5px -5px 10px var(--neu-light);
  --glass-tab-bg:rgba(255,255,255,0.18);--glass-tab-blur:blur(48px) saturate(210%);--glass-tab-border:rgba(255,255,255,0.45);
  --spring:cubic-bezier(0.175,0.885,0.32,1.275);--ease:cubic-bezier(0.25,0.46,0.45,0.94);--dur:0.2s;
}
html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:#E8E4DF;letter-spacing:-0.01em}
.phone{position:relative;width:414px;min-height:896px;background:var(--bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:96px}
.phone::after{content:'';position:absolute;bottom:0;left:0;right:0;height:260px;background:radial-gradient(ellipse 200px 140px at 20% 90%,rgba(45,108,223,.04) 0%,transparent 70%),radial-gradient(ellipse 180px 120px at 80% 85%,rgba(212,148,76,.04) 0%,transparent 70%),radial-gradient(ellipse 160px 100px at 50% 95%,rgba(45,108,223,.04) 0%,transparent 70%);pointer-events:none;z-index:0}
.phone>*:not(.tab-bar){position:relative;z-index:1}

/* ===== Section + card (同参考页) ===== */
.section{padding:0 24px;margin-top:20px;position:relative;z-index:5}
.section-title{font-size:17px;font-weight:700;color:var(--text-1);margin-bottom:12px;letter-spacing:-0.02em;display:flex;align-items:center;justify-content:space-between}
.section-title .more{font-size:13px;font-weight:500;color:var(--text-3)}

.card{background:rgba(255,255,255,0.52);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,0.70);border-radius:var(--r);box-shadow:var(--neu-out-md),0 6px 24px rgba(0,0,0,0.06),0 0 0 1px rgba(44,40,36,0.05),0 2px 8px rgba(20,184,166,0.04);overflow:hidden;position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none}

/* ===== btn-neu-primary 基础态补全（head 仅有 :active） ===== */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--brand-gradient);color:#fff;
  border:none;border-radius:9999px;
  padding:14px 24px;font-size:15px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 6px 18px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

/* ===== Exam Hero / 返回栏 ===== */
.exam-hero{padding: max(24px, env(safe-area-inset-top)) 24px 16px;
  position:relative;z-index:1;
  background:radial-gradient(ellipse 240px 200px at 25% 40%,rgba(212,148,76,.12) 0%,transparent 70%),radial-gradient(ellipse 200px 160px at 80% 80%,rgba(45,108,223,.12) 0%,transparent 70%),linear-gradient(135deg,rgba(45,108,223,0.18) 0%,rgba(212,148,76,.08) 50%,rgba(45,108,223,.06) 100%);
  border-radius:0 0 32px 32px;overflow:hidden;}
.exam-hero::before{content:"";position:absolute;top:-30%;right:-15%;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.exam-hero::after{content:"";position:absolute;bottom:-25%;left:-8%;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 70%);border-radius:50%;pointer-events:none}

.exam-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2}
.back-btn{
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,0.50);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:0.5px solid rgba(255,255,255,0.55);
  box-shadow:var(--neu-out-sm),inset 0 1px 2px rgba(255,255,255,0.50);
  display:flex;align-items:center;justify-content:center;color:var(--brand);
  cursor:pointer;flex-shrink:0;
  transition:transform var(--dur) var(--spring),background 0.15s ease;
}
.back-btn:active{transform:scale(0.85);background:rgba(255,255,255,0.70)}
.back-btn svg{width:22px;height:22px}

.exam-nav-title-block{flex:1;min-width:0;text-align:center}
.exam-nav-title{font-size:17px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em;line-height:1.2}
.exam-nav-sub{font-size:12px;color:var(--text-2);margin-top:2px;font-weight:500;letter-spacing:0.01em}

.withdraw-circle{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.50);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:0.5px solid rgba(255,255,255,0.55);box-shadow:var(--neu-out-sm),inset 0 1px 2px rgba(255,255,255,0.50);display:flex;align-items:center;justify-content:center;color:var(--brand);cursor:pointer;flex-shrink:0;transition:transform var(--dur) var(--spring),background 0.15s ease}
.withdraw-circle:active{transform:scale(0.85);background:rgba(255,255,255,0.70)}
.withdraw-circle svg{width:22px;height:22px}

.exit-hint{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:14px;position:relative;z-index:2;font-size:11.5px;color:var(--text-2);font-weight:500;letter-spacing:0.01em}
.exit-hint svg{width:13px;height:13px;color:var(--orange);flex-shrink:0}

/* ===== 考试进度条卡 ===== */
.exam-progress-section{margin-top:-10px;position:relative;z-index:10}
.exam-progress-card{padding:16px 18px}
.progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;position:relative;z-index:1}
.progress-label{font-size:14px;color:var(--text-1);font-weight:600;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.progress-label em{font-style:normal;color:var(--brand);font-weight:700}
.progress-timer{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums;letter-spacing:0.02em}
.progress-timer svg{width:16px;height:16px;color:var(--orange)}

.progress-bar-wrap{height:8px;border-radius:var(--r-pill);background:var(--fill);box-shadow:inset 2px 2px 4px var(--neu-dark),inset -2px -2px 4px var(--neu-light);overflow:hidden;position:relative;z-index:1}
.progress-bar{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--brand-mid) 0%,var(--brand) 100%);box-shadow:0 0 10px var(--brand-glow);transition:width 0.4s var(--ease)}

/* ===== 题目卡 ===== */
.question-card{padding:20px 20px 16px}
.question-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:relative;z-index:1}
.question-type-badge{
  display:inline-flex;align-items:center;padding:4px 11px;border-radius:var(--r-pill);
  background:var(--brand-subtle);border:0.5px solid rgba(45,108,223,.11);
  color:var(--brand);font-size:11.5px;font-weight:600;letter-spacing:0.02em;
}
.question-no{font-size:12.5px;color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}

.question-stem{font-size:17px;font-weight:600;color:var(--text-1);line-height:1.55;letter-spacing:-0.01em;margin-bottom:18px;position:relative;z-index:1}

.option-list{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.option-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);
  background:rgba(255,255,255,0.42);border:1.5px solid transparent;
  box-shadow:var(--neu-out-sm);cursor:pointer;font-family:var(--font);text-align:left;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),background var(--dur) var(--ease);
  position:relative;
}
.option-item:active{transform:scale(0.98);box-shadow:var(--neu-in)}
.option-letter{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);box-shadow:inset 2px 2px 4px var(--neu-dark),inset -2px -2px 4px var(--neu-light);
  color:var(--text-2);font-size:14px;font-weight:700;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
}
.option-text{flex:1;font-size:15px;color:var(--text-1);font-weight:500;letter-spacing:-0.01em;transition:color var(--dur) var(--ease),font-weight var(--dur) var(--ease)}

.option-item.selected{background:rgba(45,108,223,.05);border-color:var(--brand);box-shadow:var(--neu-out-sm),0 0 0 3px var(--brand-glow)}
.option-item.selected .option-letter{background:var(--brand);color:#fff;box-shadow:0 4px 10px var(--brand-glow),inset 0 1px 2px rgba(255,255,255,0.30)}
.option-item.selected .option-text{color:var(--brand);font-weight:600}
.option-check{width:20px;height:20px;color:var(--brand);flex-shrink:0}

.question-foot{margin-top:14px;font-size:12px;color:var(--text-2);text-align:center;position:relative;z-index:1;letter-spacing:0.01em}

/* ===== 答题卡 ===== */
.answer-sheet-card{padding:18px}
.answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative;z-index:1}
.ans-cell{
  aspect-ratio:1/1;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;color:var(--text-2);
  background:var(--bg);border:1.5px solid transparent;
  box-shadow:var(--neu-out-sm);cursor:pointer;font-family:var(--font);font-variant-numeric:tabular-nums;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.ans-cell:active{transform:scale(0.92);box-shadow:var(--neu-in)}
.ans-cell.answered{background:var(--brand);color:#fff;box-shadow:var(--neu-out-sm),0 4px 12px var(--brand-glow)}
.ans-cell.current{background:rgba(45,108,223,0.08);color:var(--brand);border-color:var(--brand);box-shadow:var(--neu-out-sm),0 0 0 3px var(--brand-glow)}

.answer-legend{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:16px;padding-top:14px;border-top:0.5px solid var(--sep);position:relative;z-index:1}
.legend-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);font-weight:500}
.legend-item .dot{width:12px;height:12px;border-radius:4px;background:var(--bg);box-shadow:inset 1px 1px 2px var(--neu-dark),inset -1px -1px 2px var(--neu-light);border:1.5px solid transparent}
.legend-item .dot.answered{background:var(--brand);box-shadow:none}
.legend-item .dot.current{background:rgba(45,108,223,0.08);border-color:var(--brand);box-shadow:none}

/* ===== 底部固定双按钮 ===== */
.exam-footer{
  position:absolute;left:0;right:0;bottom:0;z-index:50;
  padding:14px 24px 18px;
  background:linear-gradient(180deg,rgba(242,237,232,0) 0%,rgba(242,237,232,0.92) 32%,var(--bg) 60%);
  display:flex;gap:12px;align-items:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.exam-btn-prev{flex:1;padding:14px 20px;font-size:15px;gap:6px}
.exam-btn-next{flex:1.5;padding:14px 20px;font-size:15px}
.exam-btn-prev svg,.exam-btn-next svg{width:18px;height:18px}

/* Reduced Motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important}
  .back-btn,.withdraw-circle,.option-item,.ans-cell,.btn-neu-primary,.btn-neu-ghost{transition:none !important;transform:none !important}
  .exam-hero,.card,.exam-footer{backdrop-filter:none;-webkit-backdrop-filter:none}
}
</style>
