<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自家人居家维修 · 玻璃新拟态 · 服务评价</title>
    <link rel="stylesheet" href="../assets/fonts.css">
    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#0D9488;--brand-dark:#0A7A70;--brand-mid:#14B8A6;--brand-light:#CCFBF1;
  --brand-glow:rgba(13,148,136,0.28);--brand-subtle:rgba(13,148,136,0.08);
  --brand-gradient:linear-gradient(135deg,#0D9488 0%,#14B8A6 50%,#D4944C 100%);
  --accent:#D4944C;--accent-dark:#A0723C;--accent-light:#F5E6D0;--accent-glow:rgba(212,148,76,0.25);
  --bg:#F2EDE8;--bg-elevated:#F7F3EF;
  --neu-light:#FFF8F2;--neu-dark:#DDD6CE;
  --text-1:#2C2824;--text-2:#8B8178;--text-3:#B5ADA5;--text-inverse:#FFFFFF;
  --sep:rgba(44,40,36,0.06);--fill:rgba(44,40,36,0.04);
  --green:#5B8C5A;--red:#C4533A;--orange:#D4944C;--blue:#5A8FAD;
  --r:1.2rem;--r-lg:1.6rem;--r-sm:0.75rem;--r-pill:9999px;
  --font-display:'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:var(--font-body);
  --neu-out-sm:6px 6px 14px var(--neu-dark),-6px -6px 14px var(--neu-light),0 4px 16px rgba(0,0,0,0.04);
  --neu-out-md:8px 8px 18px var(--neu-dark),-8px -8px 18px var(--neu-light),0 6px 24px rgba(0,0,0,0.05);
  --neu-in:inset 4px 4px 8px var(--neu-dark),inset -4px -4px 8px var(--neu-light);
  --spring:cubic-bezier(0.175,0.885,0.32,1.275);--ease:cubic-bezier(0.25,0.46,0.45,0.94);--dur:0.2s;
}
html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:#E8E4DF;letter-spacing:-0.01em}

.phone{position:relative;width:414px;min-height:896px;background:var(--bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:100px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

/* ===== Top Nav Bar ===== */
.nav-bar{background:radial-gradient(ellipse 220px 160px at 78% 45%,rgba(212,148,76,.14) 0%,transparent 70%),radial-gradient(ellipse 180px 140px at 18% 75%,rgba(13,148,136,.16) 0%,transparent 70%),linear-gradient(135deg,rgba(13,148,136,.14) 0%,rgba(212,148,76,.08) 50%,rgba(13,148,136,.06) 100%);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;padding-top:max(18px,env(safe-area-inset-top));border-radius:0 0 28px 28px;overflow:hidden}
.nav-icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--bg-elevated);box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);display:flex;align-items:center;justify-content:center;color:var(--text-1);cursor:pointer;flex-shrink:0;transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease)}
.nav-icon-btn:active{box-shadow:var(--neu-in);transform:scale(0.94)}
.nav-title{font-size:17px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em}

/* ===== Section ===== */
.section{padding:16px 20px 0}
.section-title{font-size:15px;font-weight:700;color:var(--text-1);margin-bottom:12px}

/* ===== Glass Card ===== */
.glass-neu-card{background:rgba(255,255,255,0.52);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-radius:var(--r-lg);border:0.5px solid rgba(255,255,255,0.60);box-shadow:var(--neu-out-md);padding:20px;position:relative}
.glass-neu-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.80),transparent);pointer-events:none}

/* ===== Worker Card ===== */
.worker-card{display:flex;align-items:center;gap:14px}
.worker-avatar{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--brand),var(--brand-mid));box-shadow:var(--neu-out-sm);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600;flex-shrink:0}
.worker-info{flex:1}
.worker-name{font-size:17px;font-weight:700;margin-bottom:4px}
.worker-service{font-size:13px;color:var(--text-2);margin-bottom:4px}
.worker-rating{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--accent)}
.worker-rating .score{font-weight:600}

/* ===== Star Rating ===== */
.star-section{text-align:center;padding:24px 0}
.star-label{font-size:14px;color:var(--text-2);margin-bottom:16px}
.stars{display:flex;justify-content:center;gap:12px}
.star{width:48px;height:48px;cursor:pointer;transition:transform var(--dur) var(--spring)}
.star:active{transform:scale(0.9)}
.star svg{width:100%;height:100%}
.star.active svg{fill:var(--accent);stroke:var(--accent)}
.star-text{margin-top:12px;font-size:14px;color:var(--accent);font-weight:600}

/* ===== Tag Selector ===== */
.tag-list{display:flex;flex-wrap:wrap;gap:10px}
.tag-item{padding:8px 16px;border-radius:9999px;font-size:13px;background:rgba(255,255,255,0.52);border:0.5px solid rgba(255,255,255,0.60);box-shadow:var(--neu-out-sm);color:var(--text-2);cursor:pointer;transition:all var(--dur) var(--ease)}
.tag-item:active{box-shadow:var(--neu-in);transform:scale(0.95)}
.tag-item.selected{background:var(--brand);color:#fff;box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);border-color:transparent}

/* ===== Textarea ===== */
.review-textarea{width:100%;min-height:120px;padding:16px;border-radius:var(--r-md);background:var(--bg-elevated);border:none;box-shadow:var(--neu-in);font-family:var(--font);font-size:14px;color:var(--text-1);resize:none;outline:none;line-height:1.6}
.review-textarea::placeholder{color:var(--text-3)}
.textarea-counter{text-align:right;font-size:12px;color:var(--text-3);margin-top:8px}

/* ===== Image Upload ===== */
.upload-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.upload-item{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:var(--bg-elevated);box-shadow:var(--neu-out-sm)}
.upload-item img{width:100%;height:100%;object-fit:cover}
.upload-delete{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.upload-add{aspect-ratio:1;border-radius:12px;background:var(--bg-elevated);box-shadow:var(--neu-out-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-3);cursor:pointer;transition:all var(--dur) var(--ease)}
.upload-add:active{box-shadow:var(--neu-in);transform:scale(0.95)}
.upload-add-icon{font-size:24px}
.upload-add-text{font-size:11px}

/* ===== Anonymous Toggle ===== */
.anon-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(255,255,255,0.52);border-radius:var(--r-md);border:0.5px solid rgba(255,255,255,0.60);box-shadow:var(--neu-out-sm)}
.anon-left{display:flex;align-items:center;gap:10px}
.anon-icon{width:36px;height:36px;border-radius:10px;background:var(--bg-elevated);box-shadow:var(--neu-out-sm);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.anon-text{font-size:14px;font-weight:500}
.anon-desc{font-size:11px;color:var(--text-2)}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--neu-dark);box-shadow:var(--neu-in);position:relative;cursor:pointer;transition:background var(--dur) var(--ease)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg-elevated);box-shadow:var(--neu-out-sm);transition:transform var(--dur) var(--spring)}
.toggle.active{background:var(--brand)}
.toggle.active::after{transform:translateX(18px)}

/* ===== Submit Bar ===== */
.submit-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:414px;z-index:100;padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,0.72);backdrop-filter:blur(24px) saturate(160%);border-top:0.5px solid rgba(255,255,255,0.60);box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.submit-btn{width:100%;padding:16px;background:var(--brand-gradient);color:#fff;font-size:16px;font-weight:700;border:none;border-radius:9999px;cursor:pointer;box-shadow:var(--neu-out-sm),0 4px 14px var(--brand-glow);transition:all var(--dur) var(--spring)}
.submit-btn:active{transform:scale(0.98);box-shadow:var(--neu-in)}
    </style>
</head>
<body>
<div class="phone" data-dom-id="page-client-review">

  <!-- ===== TOP NAV BAR ===== -->
  <header class="nav-bar">
    <button class="nav-icon-btn" data-dom-id="back-btn" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 class="nav-title">服务评价</h1>
    <div style="width:44px"></div>
  </header>

  <!-- ===== WORKER INFO ===== -->
  <section class="section">
    <div class="glass-neu-card worker-card" data-dom-id="worker-info">
      <div class="worker-avatar">张</div>
      <div class="worker-info">
        <div class="worker-name">张师傅</div>
        <div class="worker-service">水管维修 · 从业8年</div>
        <div class="worker-rating">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" width="14" height="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span class="score">4.9</span>
          <span style="color:var(--text-3)">· 256次服务</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== STAR RATING ===== -->
  <section class="section">
    <div class="glass-neu-card">
      <div class="star-section" data-dom-id="star-rating">
        <div class="star-label">您对本次服务满意吗？</div>
        <div class="stars">
          <div class="star active" data-value="1">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="star active" data-value="2">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="star active" data-value="3">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="star active" data-value="4">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="star active" data-value="5">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
        </div>
        <div class="star-text">非常满意</div>
      </div>
    </div>
  </section>

  <!-- ===== SERVICE TAGS ===== -->
  <section class="section">
    <div class="section-title">服务评价标签</div>
    <div class="tag-list" data-dom-id="review-tags">
      <div class="tag-item selected">服务好</div>
      <div class="tag-item selected">准时到达</div>
      <div class="tag-item selected">技术专业</div>
      <div class="tag-item">干净整洁</div>
      <div class="tag-item">价格合理</div>
      <div class="tag-item">态度好</div>
      <div class="tag-item">响应快</div>
      <div class="tag-item">讲解细致</div>
    </div>
  </section>

  <!-- ===== REVIEW TEXT ===== -->
  <section class="section">
    <div class="section-title">评价内容</div>
    <textarea class="review-textarea" placeholder="分享您的服务体验，帮助更多用户选择合适的师傅..." data-dom-id="review-input"></textarea>
    <div class="textarea-counter">0/500字</div>
  </section>

  <!-- ===== IMAGE UPLOAD ===== -->
  <section class="section">
    <div class="section-title">上传图片（选填）</div>
    <div class="upload-grid" data-dom-id="image-upload">
      <div class="upload-item">
        <div style="width:100%;height:100%;background:linear-gradient(135deg,#e0d5c8,#c9b8a8)"></div>
        <div class="upload-delete">×</div>
      </div>
      <div class="upload-item">
        <div style="width:100%;height:100%;background:linear-gradient(135deg,#d4e8e4,#b0d0c8)"></div>
        <div class="upload-delete">×</div>
      </div>
      <div class="upload-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <span class="upload-add-text">添加图片</span>
      </div>
    </div>
  </section>

  <!-- ===== ANONYMOUS ===== -->
  <section class="section">
    <div class="anon-row" data-dom-id="anonymous-toggle">
      <div class="anon-left">
        <div class="anon-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        </div>
        <div>
          <div class="anon-text">匿名评价</div>
          <div class="anon-desc">开启后您的头像和昵称将被隐藏</div>
        </div>
      </div>
      <div class="toggle active"></div>
    </div>
  </section>

  <!-- ===== SUBMIT BAR ===== -->
  <div class="submit-bar">
    <button class="submit-btn" data-dom-id="submit-review">提交评价</button>
  </div>

</div>
</body>
</html>
