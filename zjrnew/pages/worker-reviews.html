    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Worker (Blue) */
  --brand: #2D6CDF;
  --brand-dark: #2456B8;
  --brand-mid: #5A8EE8;
  --brand-light: #DCE8FB;
  --brand-glow: rgba(45, 108, 223, 0.28);
  --brand-subtle: rgba(45, 108, 223, 0.08);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #2D6CDF;

  /* Primary */
  --primary: #2D6CDF;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

    /* Font — 统一衬线系统 */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font: var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --font-sans: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-serif: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --radius-full: var(--radius-full);}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#2D6CDF;--brand-dark:#2456B8;--brand-mid:#5A8EE8;--brand-light:#DCE8FB;
  --brand-glow:rgba(45,108,223,0.28);--brand-subtle:rgba(45,108,223,0.08);
  --brand-gradient:linear-gradient(135deg,#2D6CDF 0%,#5A8EE8 50%,#D4944C 100%);
  --accent:#D4944C;--accent-dark:#A0723C;--accent-light:#F5E6D0;--accent-glow:rgba(212,148,76,0.25);
  --bg:#F2EDE8;--bg-elevated:#F7F3EF;
  --neu-light:#FFF8F2;--neu-dark:#DDD6CE;
  --text-1:#2C2824;--text-2:#8B8178;--text-3:#B5ADA5;--text-inverse:#FFFFFF;
  --sep:rgba(44,40,36,0.06);--fill:rgba(44,40,36,0.04);
  --green:#5B8C5A;--red:#C4533A;--orange:#D4944C;--blue:#5A8FAD;
  --purple:#8B6FA8;--purple-light:rgba(139,111,168,0.12);
  --r:1.2rem;--r-lg:1.6rem;--r-sm:0.75rem;--r-pill:9999px;--r-tab:24px;
  /* Font */--font-display:'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:var(--font-body);
  --neu-out-sm:6px 6px 14px var(--neu-dark),-6px -6px 14px var(--neu-light),0 4px 16px rgba(0,0,0,0.04);
  --neu-out-md:8px 8px 18px var(--neu-dark),-8px -8px 18px var(--neu-light),0 6px 24px rgba(0,0,0,0.05);
  --neu-out-lg:10px 10px 24px var(--neu-dark),-10px -10px 24px var(--neu-light),0 8px 32px rgba(0,0,0,0.06);
  --neu-in:inset 4px 4px 8px var(--neu-dark),inset -4px -4px 8px var(--neu-light);
  --neu-in-deep:inset 5px 5px 10px var(--neu-dark),inset -5px -5px 10px var(--neu-light);
  --spring:cubic-bezier(0.175,0.885,0.32,1.275);--ease:cubic-bezier(0.25,0.46,0.45,0.94);--dur:0.2s;
}
html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:#E8E4DF;letter-spacing:-0.01em}

/* ===== Phone Frame (边到边: 无圆角/无overflow) ===== */
.phone{position:relative;width:414px;min-height:896px;background:var(--bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:40px}

/* Mono / Tabular nums */
.mono{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

/* ===== Top Nav Bar (sticky) ===== */
.nav-bar{background:radial-gradient(ellipse 220px 160px at 78% 45%,rgba(143,169,152,.14) 0%,transparent 70%),radial-gradient(ellipse 180px 140px at 18% 75%,rgba(45,108,223,.16) 0%,transparent 70%),linear-gradient(135deg,rgba(45,108,223,.14) 0%,rgba(143,169,152,.08) 50%,rgba(45,108,223,.06) 100%);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;padding-top:max(18px,env(safe-area-inset-top)); border-radius:0 0 28px 28px; overflow:hidden;}
.nav-icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--bg-elevated);
  box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-1);cursor:pointer;flex-shrink:0;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.nav-icon-btn:active{box-shadow:var(--neu-in);transform:scale(0.94)}
.nav-icon-btn svg{width:22px;height:22px}
.nav-title{font-size:17px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em}
.nav-placeholder{width:44px;height:44px;flex-shrink:0}

/* ===== Sections ===== */
.section{padding:0 20px;margin-top:16px;position:relative;z-index:2}
.section:first-of-type{margin-top:18px}

/* ===== Glass + Neumorphic Card ===== */
.glass-neu-card{
  background:rgba(255,255,255,0.52);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,0.70);
  border-radius:var(--r-lg);
  box-shadow:var(--neu-out-md),0 6px 28px rgba(0,0,0,0.06),0 2px 8px rgba(45,108,223,0.04),0 0 0 1px rgba(44,40,36,0.05);
  position:relative;overflow:hidden;
}
.glass-neu-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none;
}

/* ===== Card Title ===== */
.card-title{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em;margin-bottom:14px}

/* ===== Stars (shared) ===== */
.star-on{color:var(--orange);width:14px;height:14px;flex-shrink:0}
.star-off{color:var(--text-3);width:14px;height:14px;flex-shrink:0}
.summary-stars,.review-stars{display:inline-flex;align-items:center;gap:2px}
.summary-stars .star-on{width:16px;height:16px}

/* ===== Score Summary Card ===== */
.summary-card{padding:0}
.summary-top-bar{
  height:5px;width:100%;
  background:var(--brand-gradient);
}
.summary-body{
  display:flex;gap:20px;padding:20px 18px 22px;align-items:flex-start;
}
.summary-left{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start}
.score-big{
  font-size:48px;font-weight:800;color:var(--brand);
  line-height:1;letter-spacing:-0.03em;
  text-shadow:0 2px 12px var(--brand-glow);
}
.score-label{font-size:12px;color:var(--text-2);font-weight:500;margin-top:5px;letter-spacing:0.01em}
.summary-stars{margin-top:10px}

.summary-right{flex:1;min-width:0;display:flex;flex-direction:column}
.summary-count{
  font-size:12.5px;color:var(--text-2);font-weight:600;
  text-align:right;margin-bottom:14px;letter-spacing:0.01em;
}
.dist-list{display:flex;flex-direction:column;gap:9px}
.dist-row{display:flex;align-items:center;gap:8px}
.dist-label{
  font-size:11px;color:var(--text-2);font-weight:600;
  width:26px;flex-shrink:0;letter-spacing:0.01em;
}
.dist-track{
  flex:1;height:7px;
  background:var(--bg-elevated);
  border-radius:var(--r-pill);
  box-shadow:var(--neu-in);
  overflow:hidden;
}
.dist-fill{
  height:100%;
  background:linear-gradient(90deg,var(--brand) 0%,var(--brand-mid) 100%);
  border-radius:var(--r-pill);
  box-shadow:0 0 6px var(--brand-glow);
  transition:width 0.6s var(--ease);
}
.dist-pct{
  font-size:11px;color:var(--text-2);font-weight:700;
  width:32px;text-align:right;flex-shrink:0;
}

/* ===== Tag Cloud Card ===== */
.tag-cloud-card{padding:18px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:10px}
.tag-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 14px;
  border-radius:var(--r-pill);
  font-size:12.5px;font-weight:600;letter-spacing:0.01em;
  border:0.5px solid rgba(255,255,255,0.60);
  box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.tag-chip:active{box-shadow:var(--neu-in);transform:scale(0.95)}
.tag-ic{width:13px;height:13px;flex-shrink:0}
.tag-count{
  font-weight:800;font-size:12px;
  padding-left:3px;margin-left:1px;
  border-left:1px solid currentColor;
  padding-left:6px;opacity:0.85;
}
.tag-brand{background:rgba(45,108,223,0.10);color:var(--brand)}
.tag-accent{background:rgba(212,148,76,0.12);color:var(--accent-dark)}
.tag-green{background:rgba(91,140,90,0.12);color:var(--green)}
.tag-blue{background:rgba(90,143,173,0.12);color:var(--blue)}
.tag-purple{background:var(--purple-light);color:var(--purple)}

/* ===== Review List ===== */
.review-list{display:flex;flex-direction:column;gap:16px}

/* ===== Review Card ===== */
.review-card{padding:16px 18px}
.review-head{
  display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;
}
.review-avatar{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:var(--bg-elevated);
  box-shadow:var(--neu-in-deep);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:var(--brand);
  letter-spacing:-0.01em;
}
.review-avatar-accent{color:var(--accent-dark)}
.review-avatar-blue{color:var(--blue)}
.review-avatar-purple{color:var(--purple)}
.review-user{flex:1;min-width:0}
.review-name-row{
  display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;
}
.review-name{font-size:15px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em}
.review-service{
  display:inline-flex;align-items:center;
  font-size:10.5px;font-weight:600;
  background:var(--brand-subtle);color:var(--brand);
  padding:2px 8px;border-radius:var(--r-pill);
  border:0.5px solid rgba(45,108,223,0.18);
  letter-spacing:0.01em;
}
.review-date{
  font-size:11.5px;color:var(--text-3);font-weight:500;
  flex-shrink:0;align-self:flex-start;margin-top:2px;
}
.review-text{
  font-size:13.5px;color:var(--text-1);line-height:1.6;
  font-weight:500;letter-spacing:0.005em;
  padding:2px 0;
}
.review-foot{
  display:flex;justify-content:flex-end;align-items:center;
  margin-top:12px;padding-top:10px;
  border-top:0.5px solid var(--sep);
}
.review-replied{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:var(--text-3);font-weight:500;
}
.review-replied svg{width:13px;height:13px}
.review-reply-btn{
  display:inline-flex;align-items:center;gap:4px;
  background:transparent;border:none;
  font-size:12.5px;font-weight:600;color:var(--brand);
  font-family:var(--font);cursor:pointer;
  padding:4px 8px;border-radius:var(--r-pill);
  transition:transform var(--dur) var(--spring),opacity var(--dur) var(--ease);
}
.review-reply-btn:active{transform:scale(0.94);opacity:0.7}
.review-reply-btn svg{width:14px;height:14px}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;

    transition-duration:0.01ms !important;
