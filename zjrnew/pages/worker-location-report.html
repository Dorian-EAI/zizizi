    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Worker (Blue) */
  --brand: #2D6CDF;
  --brand-dark: #2456B8;
  --brand-mid: #5A8EE8;
  --brand-light: #DCE8FB;
  --brand-glow: rgba(45, 108, 223, 0.28);
  --brand-subtle: rgba(45, 108, 223, 0.08);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #2D6CDF;

  /* Primary */
  --primary: #2D6CDF;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

    /* Font — 统一衬线系统 */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font: var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --font-sans: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-serif: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --radius-full: var(--radius-full);}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

.mono{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

/* ===== Top Nav Bar (sticky) ===== */
.nav-bar{background:radial-gradient(ellipse 220px 160px at 78% 45%,rgba(143,169,152,.14) 0%,transparent 70%),radial-gradient(ellipse 180px 140px at 18% 75%,rgba(45,108,223,.16) 0%,transparent 70%),linear-gradient(135deg,rgba(45,108,223,.14) 0%,rgba(143,169,152,.08) 50%,rgba(45,108,223,.06) 100%);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;padding-top:max(18px,env(safe-area-inset-top)); border-radius:0 0 28px 28px; overflow:hidden;}
.nav-icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--bg-elevated);
  box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-1);cursor:pointer;flex-shrink:0;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.nav-icon-btn:active{box-shadow:var(--neu-in);transform:scale(0.94)}
.nav-icon-btn svg{width:22px;height:22px}
.nav-title{font-size:17px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em}

/* ===== Sections ===== */
.section{padding:0 20px;margin-top:16px;position:relative;z-index:2}
.section:first-of-type{margin-top:18px}

/* ===== Location Reporting Status Bar ===== */
.location-report-bar{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;
  background:var(--bg-elevated);
  border-radius:var(--r-pill);
  box-shadow:var(--neu-in),inset 0 1px 1px rgba(255,255,255,0.45);
  border:0.5px solid rgba(255,255,255,0.55);
}
.report-dot{
  position:relative;width:12px;height:12px;border-radius:50%;
  background:var(--brand);
  box-shadow:0 0 0 2px var(--brand-subtle);
  flex-shrink:0;
}
.report-pulse{
  position:absolute;inset:-4px;border-radius:50%;
  border:2px solid var(--green);
  animation:reportPulse 1.8s var(--ease) infinite;
  pointer-events:none;
}
@keyframes reportPulse{
  0%{transform:scale(1);opacity:0.55}
  70%{transform:scale(1.8);opacity:0}
  100%{transform:scale(1.8);opacity:0}
}
.report-text{font-size:13.5px;font-weight:600;color:var(--green)}

/* ===== Current Location Info Card ===== */
.location-info-card{
  background:rgba(255,255,255,0.52);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,0.70);
  border-radius:var(--r-lg);
  box-shadow:var(--neu-out-md),0 6px 28px rgba(0,0,0,0.06),0 2px 8px rgba(45,108,223,0.04),0 0 0 1px rgba(44,40,36,0.05);
  position:relative;overflow:hidden;
  padding:18px;
}
.location-info-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none;
}
.location-info-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.location-info-title{
  font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em;
}
.location-coords{
  font-size:13px;font-weight:600;color:var(--brand);
  background:var(--brand-subtle);
  padding:4px 10px;border-radius:var(--r-pill);
  border:0.5px solid rgba(45,108,223,0.15);
}
.location-address-row{
  display:flex;align-items:flex-start;gap:8px;
  margin-bottom:12px;
}
.location-address-row svg{
  width:18px;height:18px;color:var(--brand);flex-shrink:0;margin-top:2px;
}
.location-address{
  font-size:15px;font-weight:600;color:var(--text-1);line-height:1.45;
}
.location-update{
  display:flex;align-items:center;gap:6px;
  font-size:12.5px;color:var(--text-2);font-weight:500;
}
.location-update svg{
  width:15px;height:15px;color:var(--text-3);flex-shrink:0;
}

/* ===== Glass + Neumorphic Card ===== */
.glass-neu-card{
  background:rgba(255,255,255,0.52);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,0.70);
  border-radius:var(--r-lg);
  box-shadow:var(--neu-out-md),0 6px 28px rgba(0,0,0,0.06),0 2px 8px rgba(45,108,223,0.04),0 0 0 1px rgba(44,40,36,0.05);
  position:relative;overflow:hidden;
}
.glass-neu-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none;
}

/* ===== Card Title ===== */
.card-title{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em;margin-bottom:14px}

/* ===== Order Info Card ===== */
.order-info-card{padding:18px}
.order-info-list{display:flex;flex-direction:column;gap:0}
.order-info-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 0;
  border-bottom:0.5px solid var(--sep);
}
.order-info-row:last-of-type{border-bottom:none}
.order-info-label{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13.5px;color:var(--text-2);font-weight:500;flex-shrink:0;
}
.order-info-label svg{width:15px;height:15px;color:var(--text-3);flex-shrink:0}
.order-info-value{font-size:13.5px;color:var(--text-1);font-weight:600;text-align:right;max-width:60%;line-height:1.4}

/* ===== Location Actions ===== */
.location-actions{
  display:flex;flex-direction:column;gap:12px;
}
.action-row{
  display:flex;gap:12px;
}
.action-btn-secondary{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:48px;flex:1;
  background:var(--bg-elevated);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:var(--r-pill);
  font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;
  box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.action-btn-secondary:active{box-shadow:var(--neu-in);transform:scale(0.96)}
.action-btn-secondary svg{width:18px;height:18px}
.action-btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:52px;width:100%;
  background:var(--brand-gradient);color:var(--text-inverse);
  border:none;border-radius:var(--r-pill);
  font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;
  letter-spacing:0.02em;
  box-shadow:var(--neu-out-sm),0 4px 14px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.action-btn-primary:active{box-shadow:var(--neu-in);transform:scale(0.96)}
.action-btn-primary svg{width:19px;height:19px}
.location-note{
  text-align:center;
  font-size:12px;color:var(--text-2);font-weight:500;line-height:1.5;
  margin-top:4px;
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
  .report-pulse{animation:none;opacity:0}
}

--font-serif: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
--color-background:var(--background);--color-foreground:var(--foreground);--color-card:var(--card);--color-card-foreground:var(--card-foreground);--color-popover:var(--popover);--color-popover-foreground:var(--popover-foreground);--color-primary:var(--primary);--color-primary-foreground:var(--primary-foreground);--color-muted:var(--muted);--color-muted-foreground:var(--muted-foreground);--color-border:var(--border);--color-input:var(--input);--color-ring:var(--ring);--radius-md:var(--radius-md);}</style>
