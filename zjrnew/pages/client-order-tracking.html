    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Client (Teal) */
  --brand: #0D9488;
  --brand-dark: #0A7A70;
  --brand-mid: #14B8A6;
  --brand-light: #CCFBF1;
  --brand-glow: rgba(13, 148, 136, 0.24);
  --brand-subtle: rgba(13, 148, 136, 0.10);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #0D9488;

  /* Primary */
  --primary: #0D9488;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

    /* Font — 统一衬线系统 */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font: var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --font-sans: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-serif: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --radius-full: var(--radius-full);}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}
    </style>

    <style id="scroll-morph">
      /* === 实时追踪页滚动变形（client-order-tracking → client-order-tracking-2）=== */
      /* 在微信小程序中：这些变量通过 setData 注入 WXML 的 style；HTML 原型用 scroll 事件直接更新。 */
      .phone {
        --morph-p: 0;
        --reveal-p: 0;
        --nav-pt: 18px;
        --nav-pb: 18px;
        --nav-ph: 20px;
        --nav-radius: 28px;
        --btn-size: 44px;
        --map-h: 420px;
        --status-translate: 0px;
        --status-mt: -32px;
      }

      .nav-bar.morphing {
        display: grid;
        grid-template-columns: var(--btn-size) 1fr var(--btn-size);
        gap: 8px;
        align-items: center;
        padding: var(--nav-pt) var(--nav-ph) var(--nav-pb);
        border-radius: 0 0 var(--nav-radius) var(--nav-radius);
        will-change: padding, border-radius;
      }
      /* Hero 渐变在滚动中渐入覆盖原导航栏渐变 */
      .nav-bar.morphing::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        pointer-events: none;
        opacity: var(--morph-p);
        background:
          radial-gradient(ellipse 240px 200px at 75% 40%, rgba(212,148,76,.32) 0%, transparent 70%),
          radial-gradient(ellipse 200px 160px at 20% 80%, rgba(13,148,136,.24) 0%, transparent 70%),
          linear-gradient(135deg, rgba(13,148,136,.28) 0%, rgba(212,148,76,.20) 50%, rgba(20,184,166,.12) 100%);
        transition: opacity 0.05s linear;
      }
      .nav-bar.morphing .nav-title {
        font-size: calc(17px + 5px * var(--morph-p));
        text-align: center;
        justify-self: center;
        transition: font-size 0.05s linear;
      }
      .nav-bar.morphing .nav-icon-btn {
        width: var(--btn-size);
        height: var(--btn-size);
        transition: width 0.05s linear, height 0.05s linear;
      }

      /* 地图区域收缩 */
      .tracking-map-section .tracking-map {
        height: var(--map-h);
        transform: scale(calc(1 - 0.08 * var(--morph-p)));
        opacity: calc(1 - 0.7 * var(--morph-p));
        transform-origin: center center;
        transition: height 0.05s linear, transform 0.05s linear, opacity 0.05s linear;
      }
      .tracking-map-section::before {
        opacity: calc(1 - var(--morph-p));
        transition: opacity 0.05s linear;
      }

      /* 状态横幅从地图底部漂浮到 Hero 下方（filter-tabs 位置） */
      .phone .tracking-status-bar {
        position: relative;
        z-index: 40;
        transform: translateY(var(--status-translate));
        margin-top: var(--status-mt);
        padding: calc(16px - 2px * var(--morph-p)) 18px;
        transition: transform 0.05s linear, margin-top 0.05s linear, padding 0.05s linear;
      }

      /* 内容区域滚动揭示 */
      .morph-reveal,
      .morph-reveal-item {
        opacity: var(--item-reveal-p, var(--reveal-p, 0));
        transform: translateY(calc(16px * (1 - var(--item-reveal-p, var(--reveal-p, 0)))));
        transition: opacity 0.05s linear, transform 0.05s linear;
      }
    </style>
</head>

<div class="phone" data-dom-id="page-client-order-tracking">

  <!-- ===== TOP NAV BAR (sticky) ===== -->
  <header class="nav-bar" style="border-bottom-left-radius: 2px; border-bottom-right-radius: 2px;">
    <button class="nav-icon-btn" data-dom-id="back-btn" aria-label="返回">

  <!-- ===== TRACKING MAP AREA ===== -->

      <!-- Simulated map background grid + roads -->

      <div class="map-road map-road-1"></div>
      <div class="map-road map-road-2"></div>
      <div class="map-road map-road-3"></div>
      <div class="map-park"></div>

      <!-- Route polyline -->
      <svg class="route-svg" viewBox="0 0 414 420" preserveAspectRatio="none">
        <path class="route-line route-line-shadow" d="M 320 110 Q 280 150 240 180 T 180 240 T 130 300"></path>
        <path class="route-line" d="M 320 110 Q 280 150 240 180 T 180 240 T 130 300"></path>
      </svg>

      <!-- Worker marker -->
      <div class="map-marker worker-marker">
        <div class="marker-pulse"></div>
        <div class="marker-core worker-marker-core">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M18 21v-2a4 4 0 0 0-4-4H10a4 4 0 0 0-4 4v2"></path>
          </svg>
        </div>
      </div>

      <!-- Destination marker -->

        <div class="marker-core dest-marker-core">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>

    <!-- Status banner overlapping map bottom edge -->

        <div class="status-bar-title">

          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </div>
    </div>

  </section>

  <!-- ===== Copied: Worker Info Card (below status bar) ===== -->
  <section class="section copied-below-anchor">
    <div class="glass-neu-card tracking-worker-card force-visible" style="top: 0px;">
      <div class="avatar-col">
        <div class="worker-avatar avatar-glass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>

      </div>
      <div class="worker-actions">
        <button class="action-circle" data-dom-id="call-worker-copy" aria-label="拨打电话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>

  <!-- ===== Copied: Service Progress Timeline ===== -->
  <section class="section">
    <div class="glass-neu-card tracking-timeline-card force-visible">
      <div class="card-title">服务进度</div>
      <div class="tracking-timeline">

        <div class="tt-item tt-done">
          <div class="tt-rail">
            <div class="tt-dot">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5"></path>
              </svg>
            </div>
            <div class="tt-line"></div>
          </div>

    <style>@theme inline{--font-sans: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
--font-serif: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
--color-background:var(--background);--color-foreground:var(--foreground);--color-card:var(--card);--color-card-foreground:var(--card-foreground);--color-popover:var(--popover);--color-popover-foreground:var(--popover-foreground);--color-primary:var(--primary);--color-primary-foreground:var(--primary-foreground);--color-muted:var(--muted);--color-muted-foreground:var(--muted-foreground);--color-border:var(--border);--color-input:var(--input);--color-ring:var(--ring);--radius-md:var(--radius-md);}</style>
    <style>@layer base{body{background:var(--background);color:var(--foreground);font-family:var(--font-body);}}</style>
    <script>
      // === 实时追踪页滚动变形脚本 ===
      // 对应规范：小程序动画与布局实现规范.md 第 2.2 节
      // 在微信小程序中：把 .phone 的 scroll 事件替换为 scroll-view 的 bindscroll，
      // 把 setProperty 更新 CSS 变量替换为 setData 动态绑定 style。
      (function () {
        const phone = document.querySelector('.phone[data-dom-id="page-client-order-tracking"]');
        if (!phone) return;

        const navBar = phone.querySelector('.nav-bar');
        const buttons = phone.querySelectorAll('.nav-bar .nav-icon-btn');
        const revealEls = phone.querySelectorAll('.tracking-worker-card, .tracking-timeline-card, .order-detail-link');
        const staggerItems = phone.querySelectorAll('.tt-item');

        if (navBar) {
          navBar.classList.add('morphing');
          // 移除 HTML 内联的 2px 圆角，让 CSS 变量接管
          navBar.style.borderBottomLeftRadius = '';
          navBar.style.borderBottomRightRadius = '';
        }

        revealEls.forEach(el => el.classList.add('morph-reveal'));
        staggerItems.forEach((el, i) => {
          el.classList.add('morph-reveal-item');
          el.style.setProperty('--item-index', String(i));
        });

        function syncMorph() {
          const y = phone.scrollTop || 0;
          const morphP = Math.min(Math.max(y / 120, 0), 1);
          const revealStart = 120;
          const revealRange = 80;
          const revealP = Math.min(Math.max((y - revealStart) / revealRange, 0), 1);

          // 1) 导航栏 → Hero 形态
          phone.style.setProperty('--morph-p', morphP.toFixed(4));
          phone.style.setProperty('--reveal-p', revealP.toFixed(4));
          phone.style.setProperty('--nav-pt', (18 + 20 * morphP) + 'px');
          phone.style.setProperty('--nav-pb', (18 + 6 * morphP) + 'px');
          phone.style.setProperty('--nav-ph', (20 + 4 * morphP) + 'px');
          phone.style.setProperty('--nav-radius', (28 + 4 * morphP) + 'px');
          phone.style.setProperty('--btn-size', (44 - 4 * morphP) + 'px');

          // 2) 地图区域高度 420px → 120px，同时轻微缩小并淡出
          phone.style.setProperty('--map-h', Math.max(120, 420 - 300 * morphP) + 'px');

          // 3) 状态横幅从地图底部漂浮到 Hero 下方（filter-tabs 位置）
          // 初始位置约 phone 顶部下 468px；目标位置约 84px；差值约 106px 由 transform 补足
          phone.style.setProperty('--status-translate', (-106 * morphP) + 'px');
          phone.style.setProperty('--status-mt', (-32 + 14 * morphP) + 'px');

          // 4) 两侧按钮由新拟态圆钮渐变为玻璃圆钮
          const p = morphP;
          const bgMix = `color-mix(in srgb, var(--bg-elevated) ${(1 - p) * 100}%, rgba(255,255,255,0.18) ${p * 100}%)`;
          const border = p < 0.02 ? 'none' : `0.5px solid rgba(255,255,255,${(0.30 * p).toFixed(2)})`;
          const shadows = [];
          if (p < 0.98) {
            const q = 1 - p;
            shadows.push(`${6 * q}px ${6 * q}px 14px rgba(221,214,206,${(0.76 * q).toFixed(2)})`);
            shadows.push(`${-6 * q}px ${-6 * q}px 14px rgba(255,248,242,${(0.55 * q).toFixed(2)})`);
            shadows.push(`0 ${4 * q}px ${16}px rgba(0,0,0,${(0.04 * q).toFixed(2)})`);
            shadows.push(`inset 0 1px 1px rgba(255,255,255,${(0.45 * q).toFixed(2)})`);
          }
          if (p > 0.02) {
            shadows.push(`inset 0 1px 2px rgba(255,255,255,${(0.30 * p).toFixed(2)})`);
          }
          const boxShadow = shadows.join(', ');
          const backdrop = `blur(${16 * p}px)`;
          buttons.forEach(btn => {
            btn.style.background = bgMix;
            btn.style.border = border;
            btn.style.boxShadow = boxShadow;
            btn.style.backdropFilter = backdrop;
            btn.style.webkitBackdropFilter = backdrop;
          });

          // 5) 下方内容依次揭示（stagger 约 24px/项）
          staggerItems.forEach((item, i) => {
            const offset = 24 * i;
            const itemP = Math.min(Math.max((y - revealStart - offset) / revealRange, 0), 1);
            item.style.setProperty('--item-reveal-p', itemP.toFixed(4));
          });
        }

        syncMorph();
        phone.addEventListener('scroll', syncMorph, { passive: true });
        window.addEventListener('resize', syncMorph, { passive: true });
      })();
    </script>
</body>
</html>
