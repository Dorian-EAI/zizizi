    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Client (Teal) */
  --brand: #0D9488;
  --brand-dark: #0A7A70;
  --brand-mid: #14B8A6;
  --brand-light: #CCFBF1;
  --brand-glow: rgba(13, 148, 136, 0.24);
  --brand-subtle: rgba(13, 148, 136, 0.10);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #0D9488;

  /* Primary */
  --primary: #0D9488;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

  /* Font — unified serif system */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:    'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:    'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:         var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --radius-full: var(--radius-full);
}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Tab Bar — Premium Liquid Glass, absolute-positioned within .phone frame */
.tab-bar{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:360px;
  height:56px;
  z-index:100;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(48px) saturate(210%);
  -webkit-backdrop-filter:blur(48px) saturate(210%);
  border:0.5px solid rgba(255,255,255,0.45);
  border-radius:24px;
  box-shadow:
    inset 0 1.5px 3px rgba(255,255,255,0.60),
    inset 0 -0.5px 1px rgba(255,255,255,0.20),
    0 0 0 0.5px rgba(0,0,0,0.04),
    0 2px 10px rgba(0,0,0,0.06),
    0 12px 36px rgba(0,0,0,0.08);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 6px;
}
.tab-bar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(160deg,
    rgba(255,255,255,0.42) 0%,
    rgba(255,255,255,0.16) 20%,
    rgba(255,255,255,0.03) 40%,
    transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  padding:0.5px;
  pointer-events:none;
  z-index:1;
}
.tab-bar::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(320deg,
    transparent 60%,
    rgba(13,148,136,0.06) 80%,
    rgba(255,255,255,0.04) 100%);
  pointer-events:none;
  z-index:1;
}
.tab-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  width:68px;
  height:44px;
  border-radius:14px;
  color:var(--text-3);
  font-size:11px;
  font-weight:500;
  text-decoration:none;
  position:relative;
  transition:all .2s;
}
.tab-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.tab-item[data-active="true"]{
  color:var(--brand);
  font-weight:600;
}
.tab-item[data-active="true"]::before{
  content:"";
  position:absolute;
  width:54px;
  height:42px;
  border-radius:16px;
  background:rgba(13,148,136,0.16);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:0.5px solid rgba(13,148,136,0.30);
  box-shadow:
    inset 0 1px 3px rgba(255,255,255,0.55),
    inset 0 -0.5px 1px rgba(255,255,255,0.15),
    0 2px 10px rgba(13,148,136,0.20),
    0 0 0 0.5px rgba(13,148,136,0.08);
  z-index:0;
}
.tab-item[data-active="true"] svg{
  transform:scale(1.08);
  position:relative;
  z-index:1;
}

/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

<div class="phone" data-dom-id="page-client-feedback">

  <!-- ===== Top Back Bar ===== -->
  <header class="nav-bar">
    <button class="back-btn" data-dom-id="back-btn" data-target-page="page-client-mine" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title">意见反馈</span>
    <span class="nav-placeholder"></span>
  </header>

  <!-- ===== 反馈类型 ===== -->
  <div class="section">
    <div class="section-title">反馈类型</div>
    <div class="chips-row" data-dom-id="feedback-type">
      <span class="chip chip-active" data-dom-id="type-suggest" data-action="select-feedback-type" data-type="功能建议">功能建议</span>
      <span class="chip" data-dom-id="type-complaint" data-action="select-feedback-type" data-type="服务投诉">服务投诉</span>
      <span class="chip" data-dom-id="type-fault" data-action="select-feedback-type" data-type="故障反馈">故障反馈</span>
      <span class="chip" data-dom-id="type-other" data-action="select-feedback-type" data-type="其他">其他</span>
    </div>
  </div>

  <!-- ===== 问题描述 ===== -->
  <div class="section">
    <div class="section-title">问题描述</div>
    <div class="glass-card">
      <textarea class="textarea" data-dom-id="feedback-desc" data-action="update-feedback-description" rows="5" placeholder="请详细描述你的问题或建议，至少10字..." maxlength="500"></textarea>
      <div class="textarea-foot">
        <span class="textarea-tip">真实客观的描述有助于我们更快处理</span>
        <span class="textarea-count"><span data-dom-id="desc-count">0</span>/500</span>
      </div>
    </div>
  </div>

  <!-- ===== 图片上传 ===== -->
  <div class="section">
    <div class="section-title">上传图片（选填）</div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="示例图片"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <button class="upload-del" data-dom-id="del-1" data-action="delete-uploaded-image" aria-label="删除图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

        <span>添加图片</span>
      </div>

<style>

.history-card:active{transform:scale(0.98);box-shadow:var(--neu-in)}
.history-card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none}

<script>
(function(){
  /* 反馈类型单选切换 */
  var chips=document.querySelectorAll('.chips-row .chip');
  chips.forEach(function(c){
    c.addEventListener('click',function(){
      chips.forEach(function(x){x.classList.remove('chip-active')});
      c.classList.add('chip-active');
    });
  });
  /* 字数统计 */
  var ta=document.querySelector('[data-dom-id="feedback-desc"]');
  var ct=document.querySelector('[data-dom-id="desc-count"]');
  if(ta&&ct){
    ta.addEventListener('input',function(){ct.textContent=ta.value.length});
  }
})();
</script>
