    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Worker (Blue) */
  --brand: #2D6CDF;
  --brand-dark: #2456B8;
  --brand-mid: #5A8EE8;
  --brand-light: #DCE8FB;
  --brand-glow: rgba(45, 108, 223, 0.28);
  --brand-subtle: rgba(45, 108, 223, 0.08);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #2D6CDF;

  /* Primary */
  --primary: #2D6CDF;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

    /* Font — 统一衬线系统 */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font: var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --font-sans: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-serif: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --radius-full: var(--radius-full);}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Buttons */
.btn-neu-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--text-inverse);
  border:none;border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm),0 2px 8px var(--brand-glow);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

    </style>

<div class="phone" data-dom-id="page-worker-quote-submit">

  <!-- ===== TOP NAV BAR (sticky) ===== -->
  <header class="nav-bar">
    <button class="nav-icon-btn" data-dom-id="back-btn" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>
    <h1 class="nav-title">提交报价</h1>
    <div class="nav-placeholder" aria-hidden="true"></div>
  </header>

  <!-- ===== ORDER SUMMARY CARD (read-only) ===== -->
  <section class="section">
    <div class="glass-neu-card summary-card">
      <div class="card-title">订单摘要</div>
      <div class="summary-list">
        <div class="summary-row">
          <span class="summary-label">
            <svg class="summary-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            服务类型
          </span>
          <span class="summary-value">防水维修</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">
            <svg class="summary-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            客户地址
          </span>
          <span class="summary-value">北京市朝阳区建国路88号</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">
            <svg class="summary-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
            预约时间
          </span>
          <span class="summary-value mono">今天 15:00-18:00</span>
        </div>
        <div class="summary-desc">
          <div class="summary-desc-label">问题描述</div>
          <div class="summary-desc-text">卫生间墙面渗水，需检查防水层</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== QUOTE AMOUNT INPUT CARD ===== -->
  <section class="section">
    <div class="glass-neu-card amount-card">
      <div class="amount-label">报价金额</div>
      <div class="amount-field">
        <span class="amount-symbol">&yen;</span>
        <input class="amount-input" type="text" inputmode="decimal" value="150" placeholder="0" data-dom-id="quote-amount" aria-label="报价金额">
      </div>
      <div class="amount-divider"></div>
      <div class="amount-quick">
        <button class="quick-chip" data-amount="100" data-dom-id="quick-100">&yen;100</button>
        <button class="quick-chip is-active" data-amount="150" data-dom-id="quick-150">&yen;150</button>
        <button class="quick-chip" data-amount="200" data-dom-id="quick-200">&yen;200</button>
        <button class="quick-chip" data-amount="custom" data-dom-id="quick-custom">自定义</button>
      </div>
    </div>
  </section>

  <!-- ===== FORM CARD ===== -->
  <section class="section">
    <div class="glass-neu-card form-card">
      <div class="card-title">报价明细</div>

      <!-- 预计用时 -->
      <div class="form-row">
        <span class="form-label">预计用时</span>
        <div class="duration-group">
          <button class="dur-chip" data-dur="1" data-dom-id="dur-1">1h</button>
          <button class="dur-chip is-active" data-dur="1.5" data-dom-id="dur-1-5">1.5h</button>
          <button class="dur-chip" data-dur="2" data-dom-id="dur-2">2h</button>
          <button class="dur-chip" data-dur="3" data-dom-id="dur-3">3h+</button>
        </div>
      </div>

      <!-- 材料费（选填） -->
      <div class="form-row">
        <span class="form-label">材料费<span class="form-label-opt">选填</span></span>
        <div class="neu-input">
          <span class="neu-input-prefix">&yen;</span>
          <input type="text" inputmode="decimal" placeholder="0.00" data-dom-id="material-fee" aria-label="材料费">
        </div>
      </div>

      <!-- 上门时间 -->
      <div class="form-row">
        <span class="form-label">上门时间</span>
        <div class="neu-input">
          <input type="text" readonly value="今天 15:00-18:00" data-dom-id="visit-time" aria-label="上门时间">
          <svg class="neu-input-suffix-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
        </div>
      </div>

      <!-- 报价说明（选填） -->
      <div class="form-row">
        <span class="form-label">报价说明<span class="form-label-opt">选填</span></span>
        <div class="neu-input neu-input-area">
          <textarea placeholder="补充说明维修方案、所用材料等" data-dom-id="quote-note" aria-label="报价说明"></textarea>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== QUOTE HINT CARD ===== -->
  <section class="section">
    <div class="glass-neu-card hint-card">
      <div class="hint-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
      </div>
      <div class="hint-text">合理报价更易被客户选中，平台抽成 <span class="hi-strong">5%</span>，预计到手 <span class="hi-net" data-dom-id="payout-amount">&yen;142.5</span></div>
    </div>
  </section>

  <!-- ===== BOTTOM FIXED ACTION BAR ===== -->
  <footer class="action-bar">
    <button class="action-btn-secondary" data-dom-id="save-draft">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
      <span>保存草稿</span>
    </button>
    <button class="action-btn-primary" data-dom-id="submit-quote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      <span>提交报价</span>
    </button>
  </footer>

</div>

html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:#E8E4DF;letter-spacing:-0.01em}

/* ===== Phone Frame (活力渐变布局: 无圆角/无overflow) ===== */
.phone{position:relative;width:414px;min-height:896px;background:var(--bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:82px}

.mono{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

/* ===== Top Nav Bar (sticky) ===== */
.nav-bar{background:radial-gradient(ellipse 220px 160px at 78% 45%,rgba(143,169,152,.14) 0%,transparent 70%),radial-gradient(ellipse 180px 140px at 18% 75%,rgba(45,108,223,.16) 0%,transparent 70%),linear-gradient(135deg,rgba(45,108,223,.14) 0%,rgba(143,169,152,.08) 50%,rgba(45,108,223,.06) 100%);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;padding-top:max(18px,env(safe-area-inset-top)); border-radius:0 0 28px 28px; overflow:hidden;}

/* ===== Sections ===== */
.section{padding:0 20px;margin-top:16px;position:relative;z-index:2}
.section:first-of-type{margin-top:18px}

/* ===== Glass + Neumorphic Card ===== */
.glass-neu-card{
  background:rgba(255,255,255,0.52);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,0.70);

  position:relative;overflow:hidden;
}
.glass-neu-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;

/* ===== Card Title ===== */
.card-title{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-0.01em;margin-bottom:14px}

/* ===== Bottom Fixed Action Bar ===== */
.action-bar{

.action-btn-primary{

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
