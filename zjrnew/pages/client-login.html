<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自家人居家维修 · 玻璃新拟态 · 登录授权</title>
    <link rel="stylesheet" href="../assets/fonts.css">
    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#0D9488;--brand-dark:#0A7A70;--brand-mid:#14B8A6;--brand-light:#CCFBF1;
  --brand-glow:rgba(13,148,136,0.28);--brand-subtle:rgba(13,148,136,0.08);
  --brand-gradient:linear-gradient(135deg,#0D9488 0%,#14B8A6 50%,#D4944C 100%);
  --accent:#D4944C;--accent-dark:#A0723C;--accent-light:#F5E6D0;--accent-glow:rgba(212,148,76,0.25);
  --bg:#F2EDE8;--bg-elevated:#F7F3EF;
  --neu-light:#FFF8F2;--neu-dark:#DDD6CE;
  --text-1:#2C2824;--text-2:#8B8178;--text-3:#B5ADA5;--text-inverse:#FFFFFF;
  --sep:rgba(44,40,36,0.06);--fill:rgba(44,40,36,0.04);
  --green:#5B8C5A;--red:#C4533A;--orange:#D4944C;--blue:#5A8FAD;
  --r:1.2rem;--r-lg:1.6rem;--r-sm:0.75rem;--r-pill:9999px;
  --font-display:'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:var(--font-body);
  --neu-out-sm:6px 6px 14px var(--neu-dark),-6px -6px 14px var(--neu-light),0 4px 16px rgba(0,0,0,0.04);
  --neu-out-md:8px 8px 18px var(--neu-dark),-8px -8px 18px var(--neu-light),0 6px 24px rgba(0,0,0,0.05);
  --neu-out-lg:10px 10px 24px var(--neu-dark),-10px -10px 24px var(--neu-light),0 8px 32px rgba(0,0,0,0.06);
  --neu-in:inset 4px 4px 8px var(--neu-dark),inset -4px -4px 8px var(--neu-light);
  --spring:cubic-bezier(0.175,0.885,0.32,1.275);--ease:cubic-bezier(0.25,0.46,0.45,0.94);--dur:0.2s;
}
html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:#E8E4DF;letter-spacing:-0.01em}

.phone{position:relative;width:414px;min-height:896px;background:var(--bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06)}

/* ===== Hero Section ===== */
.login-hero{position:relative;padding:80px 32px 40px;background:
  radial-gradient(ellipse 300px 200px at 80% 20%,rgba(212,148,76,.18) 0%,transparent 60%),
  radial-gradient(ellipse 250px 180px at 15% 60%,rgba(13,148,136,.20) 0%,transparent 60%),
  linear-gradient(160deg,rgba(13,148,136,.10) 0%,rgba(212,148,76,.06) 50%,rgba(13,148,136,.08) 100%);
  border-radius:0 0 40px 40px;
  text-align:center;
}
.logo-circle{width:96px;height:96px;border-radius:28px;margin:0 auto 24px;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--neu-out-lg),0 8px 32px var(--brand-glow)}
.app-name{font-size:28px;font-weight:700;font-family:var(--font-display);letter-spacing:-0.02em;margin-bottom:8px}
.app-slogan{font-size:14px;color:var(--text-2);letter-spacing:0.02em}

/* ===== Content ===== */
.login-content{padding:32px 24px}
.welcome-title{font-size:20px;font-weight:700;margin-bottom:8px}
.welcome-desc{font-size:13.5px;color:var(--text-2);line-height:1.6;margin-bottom:32px}

/* ===== Login Options ===== */
.login-option{display:flex;align-items:center;padding:18px 20px;margin-bottom:14px;background:rgba(255,255,255,0.52);border-radius:var(--r-lg);border:0.5px solid rgba(255,255,255,0.60);box-shadow:var(--neu-out-md);cursor:pointer;transition:all var(--dur) var(--spring)}
.login-option:active{box-shadow:var(--neu-in);transform:scale(0.98)}
.login-option-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-right:16px;flex-shrink:0}
.login-option-icon.wechat{background:linear-gradient(135deg,#07C160,#06AE56);color:#fff}
.login-option-icon.phone{background:linear-gradient(135deg,var(--brand),var(--brand-mid));color:#fff}
.login-option-text{flex:1}
.login-option-title{font-size:15px;font-weight:600;margin-bottom:3px}
.login-option-desc{font-size:12px;color:var(--text-2)}
.login-option-arrow{color:var(--text-3)}

/* ===== Agreement ===== */
.agreement-section{display:flex;align-items:flex-start;gap:10px;padding:20px 24px 0}
.agreement-checkbox{width:18px;height:18px;border-radius:6px;border:2px solid var(--neu-dark);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.agreement-checkbox.checked{background:var(--brand);border-color:var(--brand)}
.agreement-text{font-size:12px;color:var(--text-2);line-height:1.6}
.agreement-text a{color:var(--brand);text-decoration:none}

/* ===== Other Login ===== */
.other-login{padding:32px 24px 16px;text-align:center}
.other-login-title{font-size:12px;color:var(--text-3);margin-bottom:20px;position:relative}
.other-login-title::before,.other-login-title::after{content:"";position:absolute;top:50%;width:60px;height:1px;background:var(--sep)}
.other-login-title::before{left:40px}
.other-login-title::after{right:40px}
.other-login-icons{display:flex;justify-content:center;gap:32px}
.other-icon{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.52);box-shadow:var(--neu-out-sm);display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;transition:all var(--dur) var(--spring)}
.other-icon:active{box-shadow:var(--neu-in);transform:scale(0.92)}

/* ===== Footer ===== */
.login-footer{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-3)}
    </style>
</head>
<body>
<div class="phone" data-dom-id="page-client-login">

  <!-- ===== HERO ===== -->
  <div class="login-hero">
    <div class="logo-circle" data-dom-id="app-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="44" height="44">
        <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/>
        <path d="M10 17h4"/>
      </svg>
    </div>
    <div class="app-name">自家人</div>
    <div class="app-slogan">专业维修 · 安心到家</div>
  </div>

  <!-- ===== CONTENT ===== -->
  <div class="login-content">
    <div class="welcome-title">欢迎使用自家人</div>
    <div class="welcome-desc">登录后享受完整服务体验<br>发布维修需求，专业师傅极速上门</div>

    <!-- 微信一键登录 -->
    <div class="login-option" data-dom-id="login-wechat">
      <div class="login-option-icon wechat">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18z"/></svg>
      </div>
      <div class="login-option-text">
        <div class="login-option-title">微信一键登录</div>
        <div class="login-option-desc">安全快捷，推荐使用</div>
      </div>
      <svg class="login-option-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m9 18 6-6-6-6"/></svg>
    </div>

    <!-- 手机号登录 -->
    <div class="login-option" data-dom-id="login-phone">
      <div class="login-option-icon phone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
      </div>
      <div class="login-option-text">
        <div class="login-option-title">手机号登录</div>
        <div class="login-option-desc">使用手机号验证码登录</div>
      </div>
      <svg class="login-option-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m9 18 6-6-6-6"/></svg>
    </div>
  </div>

  <!-- ===== AGREEMENT ===== -->
  <div class="agreement-section" data-dom-id="agreement">
    <div class="agreement-checkbox checked">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div class="agreement-text">
      已阅读并同意<a href="#">《用户服务协议》</a>和<a href="#">《隐私政策》</a>
    </div>
  </div>

  <!-- ===== OTHER LOGIN ===== -->
  <div class="other-login">
    <div class="other-login-title">其他登录方式</div>
    <div class="other-login-icons">
      <div class="other-icon" data-dom-id="login-qq">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
      </div>
      <div class="other-icon" data-dom-id="login-apple">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      </div>
      <div class="other-icon" data-dom-id="login-password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div class="login-footer">
    自家人 © 2026 版权所有
  </div>

</div>
</body>
</html>
