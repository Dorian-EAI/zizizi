    <style id="theme-vars">
/* 自家人居家维修 - 玻璃新拟态 */
:root {
  /* Brand - Worker (Blue) */
  --brand: #2D6CDF;
  --brand-dark: #2456B8;
  --brand-mid: #5A8EE8;
  --brand-light: #DCE8FB;
  --brand-glow: rgba(45, 108, 223, 0.28);
  --brand-subtle: rgba(45, 108, 223, 0.08);

  /* Accent (Amber) */
  --accent: #D4944C;
  --accent-dark: #A0723C;
  --accent-mid: #E8C088;
  --accent-light: #F5E6D0;
  --accent-glow: rgba(212, 148, 76, 0.20);

  /* Background */
  --background: #F2EDE8;
  --foreground: #2C2824;
  --body-bg: #E8E4DF;
  --bg-elevated: #F7F3EF;

  /* Neumorphic */
  --neu-light: #FFF8F2;
  --neu-dark: #DDD6CE;
  --neu-highlight: rgba(255, 255, 255, 0.55);

  /* Surface & Card */
  --card: rgba(255, 255, 255, 0.52);
  --card-foreground: #2C2824;
  --popover: #fff;
  --popover-foreground: #2C2824;

  /* Muted */
  --muted: #F7F3EF;
  --muted-foreground: #8B8178;

  /* Border & Input */
  --border: rgba(44, 40, 36, 0.06);
  --input: rgba(44, 40, 36, 0.06);
  --ring: #2D6CDF;

  /* Primary */
  --primary: #2D6CDF;
  --primary-foreground: #ffffff;

  /* Semantic aliases */
  --state-success: #5B8C5A;
  --state-warning: #D4944C;
  --state-error: #C4533A;
  --state-info: #5A8FAD;

  /* Text */
  --text-1: #2C2824;
  --text-2: #8B8178;
  --text-3: #B5ADA5;
  --text-inverse: #ffffff;

  /* Sep & Fill */
  --sep: rgba(44, 40, 36, 0.06);
  --fill: rgba(44, 40, 36, 0.04);

  /* Green/Red/Orange/Blue semantic */
  --green: #5B8C5A;
  --red: #C4533A;
  --orange: #D4944C;
  --blue: #5A8FAD;

  /* Radius */
  --radius-sm: 0.75rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.6rem;
  --radius-full: 9999px;

    /* Font — 统一衬线系统 */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font: var(--font-body);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur: 0.2s;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(12px) saturate(140%);
  --glass-border: rgba(255, 255, 255, 0.60);

  /* Surface presets for glass-neumorphic components */
  --surface-1: rgba(255, 255, 255, 0.50);
  --surface-2: rgba(255, 255, 255, 0.45);

  /* Neumorphic shadow presets */
  --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light), 0 4px 16px rgba(0, 0, 0, 0.04);
  --neu-out-md: 8px 8px 18px var(--neu-dark), -8px -8px 18px var(--neu-light), 0 6px 24px rgba(0, 0, 0, 0.05);
  --neu-out-lg: 10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light), 0 8px 32px rgba(0, 0, 0, 0.06);
  --neu-in: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  --neu-in-deep: inset 5px 5px 10px var(--neu-dark), inset -5px -5px 10px var(--neu-light);
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --font-sans: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-serif: 'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --radius-full: var(--radius-full);}

/* Semantic token fallback */
#semantic-token-fallback {
  --brand-background: var(--background);
  --brand-foreground: var(--foreground);
  --brand-card: var(--card);
  --brand-card-foreground: var(--card-foreground);
  --brand-popover: var(--popover);
  --brand-popover-foreground: var(--popover-foreground);
  --brand-primary: var(--primary);
  --brand-primary-foreground: var(--primary-foreground);
  --brand-muted: var(--muted);
  --brand-muted-foreground: var(--muted-foreground);
  --brand-border: var(--border);
  --brand-input: var(--input);
  --brand-ring: var(--ring);
  --brand-radius-sm: var(--radius-sm);
  --brand-radius-md: var(--radius-md);
  --brand-radius-lg: var(--radius-lg);
}

/* ===== Global Neumorphic Components ===== */
/* Tab Bar */
.tab-bar{
  position:absolute;
  bottom:max(14px, env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:360px;
  height:64px;
  z-index:100;
  background:rgba(255,255,255,0.22);
  backdrop-filter:blur(48px) saturate(210%);
  -webkit-backdrop-filter:blur(48px) saturate(210%);
  border:0.5px solid rgba(255,255,255,0.50);
  border-radius:28px;
  box-shadow:
    inset 0 1.5px 3px rgba(255,255,255,0.60),
    inset 0 -0.5px 1px rgba(255,255,255,0.20),
    0 0 0 0.5px rgba(0,0,0,0.04),
    0 2px 10px rgba(0,0,0,0.06),
    0 12px 36px rgba(0,0,0,0.08);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 10px;
}
.tab-bar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(160deg,
    rgba(255,255,255,0.42) 0%,
    rgba(255,255,255,0.16) 20%,
    rgba(255,255,255,0.03) 40%,
    transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  padding:0.5px;
  pointer-events:none;
  z-index:1;
}
.tab-bar::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(320deg,
    transparent 60%,
    rgba(45,108,223,0.06) 80%,
    rgba(255,255,255,0.04) 100%);
  pointer-events:none;
  z-index:1;
}
.tab-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  width:68px;
  height:44px;
  border-radius:14px;
  color:var(--text-3);
  font-size:11px;
  font-weight:500;
  text-decoration:none;
  position:relative;
  transition:all .2s;
}
.tab-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.tab-item[data-active="true"]{
  color:var(--brand);
  font-weight:600;
}
.tab-item[data-active="true"]::before{
  content:"";
  position:absolute;
  width:54px;
  height:42px;
  border-radius:16px;
  background:rgba(45,108,223,0.16);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:0.5px solid rgba(45,108,223,0.30);
  box-shadow:
    inset 0 1px 3px rgba(255,255,255,0.55),
    inset 0 -0.5px 1px rgba(255,255,255,0.15),
    0 2px 10px rgba(45,108,223,0.20),
    0 0 0 0.5px rgba(45,108,223,0.08);
  z-index:0;
}
.tab-item[data-active="true"] svg{
  transform:scale(1.08);
  position:relative;
  z-index:1;
}

.btn-neu-primary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.50);color:var(--brand);
  border:0.5px solid rgba(255,255,255,0.60);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:var(--neu-out-sm);
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease);
}
.btn-neu-secondary:active{box-shadow:var(--neu-in);transform:scale(0.94)}

.btn-neu-ghost{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  border:0.5px solid var(--border);border-radius:9999px;
  padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.btn-neu-ghost:active{transform:scale(0.94);color:var(--brand)}

    <style>
:root{
  --brand:#2D6CDF;--brand-dark:#2456B8;--brand-light:#DCE8FB;
  --brand-glow:rgba(45,108,223,0.28);--brand-subtle:rgba(45,108,223,0.08);
  --brand-gradient:linear-gradient(135deg,#2D6CDF 0%,#5A8EE8 50%,#D4944C 100%);
  --accent:#D4944C;--accent-light:#F5E6D0;--accent-glow:rgba(212,148,76,0.25);
  --bg:#F2EDE8;--bg-elevated:#F7F3EF;
  --neu-light:#FFF8F2;--neu-dark:#DDD6CE;
  --text-1:#2C2824;--text-2:#8B8178;--text-3:#B5ADA5;--text-inverse:#FFFFFF;
  --sep:rgba(44,40,36,0.06);--fill:rgba(44,40,36,0.04);
  --green:#5B8C5A;--red:#C4533A;--orange:#D4944C;--blue:#5A8FAD;--yellow:#D4944C;
  --r:1.2rem;--r-lg:1.6rem;--r-sm:0.75rem;--r-pill:9999px;--r-tab:24px;
  /* Font */--font-display:'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:var(--font-body);
  --neu-out-sm:5px 5px 12px var(--neu-dark),-5px -5px 12px var(--neu-light);
  --neu-out-md:8px 8px 18px var(--neu-dark),-8px -8px 18px var(--neu-light);
  --neu-out-lg:10px 10px 24px var(--neu-dark),-10px -10px 24px var(--neu-light);
  --neu-in:inset 4px 4px 8px var(--neu-dark),inset -4px -4px 8px var(--neu-light);
  --neu-in-deep:inset 5px 5px 10px var(--neu-dark),inset -5px -5px 10px var(--neu-light);
  --glass-tab-bg:rgba(255,255,255,0.18);--glass-tab-blur:blur(48px) saturate(210%);--glass-tab-border:rgba(255,255,255,0.45);
  --spring:cubic-bezier(0.175,0.885,0.32,1.275);--ease:cubic-bezier(0.25,0.46,0.45,0.94);--dur:0.2s;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:#E8E4DF;letter-spacing:-0.01em}
.phone{position:relative;width:414px;min-height:896px;background:var(--bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:82px}
.phone::after{content:'';position:absolute;bottom:0;left:0;right:0;height:260px;background:radial-gradient(ellipse 200px 140px at 20% 90%,rgba(45,108,223,.07) 0%,transparent 70%),radial-gradient(ellipse 180px 120px at 80% 85%,rgba(143,169,152,.06) 0%,transparent 70%),radial-gradient(ellipse 160px 100px at 50% 95%,rgba(124,142,212,.04) 0%,transparent 70%);pointer-events:none;z-index:0}
.phone>*:not(.tab-bar){position:relative;z-index:1}

/* Hero */
.hero{padding: max(38px, env(safe-area-inset-top)) 24px 56px;position:relative;z-index:1;background:radial-gradient(ellipse 240px 200px at 25% 40%,rgba(143,169,152,0.32) 0%,transparent 70%),radial-gradient(ellipse 200px 160px at 80% 80%,rgba(45,108,223,0.24) 0%,transparent 70%),linear-gradient(135deg,rgba(45,108,223,0.28) 0%,rgba(143,169,152,0.20) 50%,rgba(45,108,223,0.12) 100%);border-radius:0 0 32px 32px;overflow:hidden}

/* Profile Row */
.profile-row{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.avatar-col{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0}
.avatar{width:48px;height:48px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;z-index:1;transition:transform var(--dur) var(--ease);background:var(--bg);box-shadow:inset 3px 3px 6px var(--neu-dark),inset -3px -3px 6px var(--neu-light)}
.avatar.avatar-glass{background:linear-gradient(145deg,rgba(255,255,255,0.68) 0%,rgba(255,255,255,0.28) 40%,var(--brand-subtle) 78%,rgba(255,255,255,0.18) 100%);backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);border:0.5px solid rgba(255,255,255,0.75);box-shadow:inset 0 2px 3px rgba(255,255,255,0.88),inset 0 -1px 2px rgba(0,0,0,0.04),var(--neu-out-sm)}
.avatar.avatar-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,0.48) 0%,rgba(255,255,255,0.12) 35%,transparent 60%);pointer-events:none}
.avatar:active{transform:scale(0.97)}
.avatar svg{width:26px;height:26px;stroke:var(--brand);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.profile-info{flex:1;min-width:0}
.name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.profile-name{font-size:20px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em;line-height:1.2}
.verify-badge{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,0.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.70);color:var(--brand);font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);line-height:1.4;letter-spacing:0.01em}
.verify-badge svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Edit Button */
.edit-btn{width:36px;height:36px;background:rgba(255,255,255,0.50);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.75);color:var(--brand);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform var(--dur) var(--ease),box-shadow 0.15s var(--ease);flex-shrink:0;box-shadow:var(--neu-out-sm),inset 0 1px 1.5px rgba(255,255,255,0.50)}
.edit-btn:active{box-shadow:var(--neu-in);transform:scale(0.96)}
.edit-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Rating Row */
.rating-row{display:flex;align-items:center;gap:8px;margin-top:14px;position:relative;z-index:2}
.rating-chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-1);font-weight:600}
.rating-chip svg{width:14px;height:14px;color:var(--orange);fill:var(--orange);flex-shrink:0}
.rating-divider{width:3px;height:3px;border-radius:50%;background:var(--text-3);flex-shrink:0}
.service-count{font-size:13px;color:var(--text-2);font-weight:500}

/* Stats Card */
.stats-card{position:relative;z-index:10;margin:-24px 24px 0;padding:20px 12px;background:rgba(255,255,255,0.52);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,0.70);border-radius:var(--r-lg);box-shadow:var(--neu-out-lg),0 10px 36px rgba(0,0,0,0.08),0 0 0 1px rgba(44,40,36,0.05),0 2px 8px rgba(20,184,166,0.04);display:flex;align-items:center}
.stats-card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none}
.stat-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;padding:0 8px;cursor:pointer;transition:transform var(--dur) var(--ease)}
.stat-col:active{transform:scale(0.97)}
.stat-col:not(:last-child)::after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:0.5px;background:var(--sep)}
.stat-num{font-size:24px;font-weight:700;color:var(--text-1);letter-spacing:-0.5px;line-height:1;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.stat-num.brand{color:var(--brand)}
.stat-label{font-size:12px;color:var(--text-2);line-height:1;font-weight:500;position:relative;z-index:1}

/* Section + Menu Card */
.section{padding:0 24px;margin-top:18px;position:relative;z-index:5}
.section-title{font-size:17px;font-weight:700;color:var(--text-1);margin:0 4px 10px;letter-spacing:-0.02em}
.card{background:rgba(255,255,255,0.52);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,0.70);border-radius:var(--r-lg);box-shadow:var(--neu-out-md),0 6px 24px rgba(0,0,0,0.06),0 0 0 1px rgba(44,40,36,0.05),0 2px 8px rgba(20,184,166,0.04);overflow:hidden;position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 30%,transparent 55%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:0.5px;pointer-events:none}
.menu-card{overflow:hidden;padding:4px 0}
.menu-row{display:flex;align-items:center;gap:14px;padding:14px 18px;position:relative;cursor:pointer;transition:transform var(--dur) var(--ease);z-index:1}
.menu-row:active{transform:scale(0.97)}
.menu-row:not(:last-child)::after{content:"";position:absolute;left:64px;right:18px;bottom:0;height:0.5px;background:var(--sep)}

/* Menu Icons */
.menu-icon{width:34px;height:34px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg);box-shadow:4px 4px 8px var(--neu-dark),-4px -4px 8px var(--neu-light),inset 0 1px 1px rgba(255,255,255,0.45)}
.menu-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-icon-coral{color:var(--red)}
.menu-icon-teal{color:var(--brand)}
.menu-icon-blue{color:var(--blue)}
.menu-icon-amber{color:var(--orange)}
.menu-icon-purple{color:var(--brand)}
.menu-icon-gray{color:var(--text-2)}
.menu-icon-green{color:var(--green)}
.menu-label{flex:1;font-size:15px;color:var(--text-1);font-weight:500;letter-spacing:-0.01em}
.menu-value{font-size:14px;color:var(--text-2);font-weight:500;margin-right:2px;text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-value.green{color:var(--green);font-weight:600}
.menu-chevron{width:14px;height:14px;fill:none;stroke:var(--text-3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}




/* Reduced Motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important}
  .avatar,.edit-btn,.stat-col,.menu-row,.tab-item,.tab-item svg{transition:none !important;transform:none !important}
  .tab-item[data-active="true"]::before{backdrop-filter:none;-webkit-backdrop-filter:none}
  .stats-card,.card,.edit-btn,.verify-badge,.tab-bar{backdrop-filter:none;-webkit-backdrop-filter:none}
}
</style>
</body>
