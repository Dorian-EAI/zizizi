<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自家人居家维修 · 玻璃新拟态 · 确认支付</title>
    <link rel="stylesheet" href="../assets/fonts.css">
    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#0D9488;--brand-dark:#0A7A70;--brand-mid:#14B8A6;--brand-light:#CCFBF1;
  --brand-glow:rgba(13,148,136,0.28);--brand-subtle:rgba(13,148,136,0.08);
  --brand-gradient:linear-gradient(135deg,#0D9488 0%,#14B8A6 50%,#D4944C 100%);
  --accent:#D4944C;--accent-dark:#A0723C;--accent-light:#F5E6D0;--accent-glow:rgba(212,148,76,0.25);
  --bg:#F2EDE8;--bg-elevated:#F7F3EF;
  --neu-light:#FFF8F2;--neu-dark:#DDD6CE;
  --text-1:#2C2824;--text-2:#8B8178;--text-3:#B5ADA5;--text-inverse:#FFFFFF;
  --sep:rgba(44,40,36,0.06);--fill:rgba(44,40,36,0.04);
  --green:#5B8C5A;--red:#C4533A;--orange:#D4944C;--blue:#5A8FAD;
  --r:1.2rem;--r-lg:1.6rem;--r-sm:0.75rem;--r-pill:9999px;
  --font-display:'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:'Noto Serif SC', 'Cormorant Garamond', 'STSong', Georgia, serif;
  --font-nums:'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --font:var(--font-body);
  --neu-out-sm:6px 6px 14px var(--neu-dark),-6px -6px 14px var(--neu-light),0 4px 16px rgba(0,0,0,0.04);
  --neu-out-md:8px 8px 18px var(--neu-dark),-8px -8px 18px var(--neu-light),0 6px 24px rgba(0,0,0,0.05);
  --neu-out-lg:10px 10px 24px var(--neu-dark),-10px -10px 24px var(--neu-light),0 8px 32px rgba(0,0,0,0.06);
  --neu-in:inset 4px 4px 8px var(--neu-dark),inset -4px -4px 8px var(--neu-light);
  --neu-in-deep:inset 5px 5px 10px var(--neu-dark),inset -5px -5px 10px var(--neu-light);
  --spring:cubic-bezier(0.175,0.885,0.32,1.275);--ease:cubic-bezier(0.25,0.46,0.45,0.94);--dur:0.2s;
}
html,body{font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;background:#E8E4DF;letter-spacing:-0.01em}

.phone{position:relative;width:414px;min-height:896px;background:var(--bg);border-radius:48px;overflow:hidden;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);padding-bottom:100px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

/* ===== Top Nav Bar ===== */
.nav-bar{background:radial-gradient(ellipse 220px 160px at 78% 45%,rgba(212,148,76,.14) 0%,transparent 70%),radial-gradient(ellipse 180px 140px at 18% 75%,rgba(13,148,136,.16) 0%,transparent 70%),linear-gradient(135deg,rgba(13,148,136,.14) 0%,rgba(212,148,76,.08) 50%,rgba(13,148,136,.06) 100%);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;padding-top:max(18px,env(safe-area-inset-top));border-radius:0 0 28px 28px;overflow:hidden}
.nav-icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--bg-elevated);box-shadow:var(--neu-out-sm),inset 0 1px 1px rgba(255,255,255,0.45);display:flex;align-items:center;justify-content:center;color:var(--text-1);cursor:pointer;flex-shrink:0;transition:transform var(--dur) var(--spring),box-shadow var(--dur) var(--ease)}
.nav-icon-btn:active{box-shadow:var(--neu-in);transform:scale(0.94)}
.nav-title{font-size:17px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em}

/* ===== Section ===== */
.section{padding:16px 20px 0}
.section-title{font-size:15px;font-weight:700;color:var(--text-1);margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* ===== Glass Neumorphic Card ===== */
.glass-neu-card{background:rgba(255,255,255,0.52);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-radius:var(--r-lg);border:0.5px solid rgba(255,255,255,0.60);box-shadow:var(--neu-out-md),0 6px 28px rgba(0,0,0,0.06),0 2px 8px var(--brand-subtle),0 0 0 1px rgba(44,40,36,0.03);padding:20px;position:relative;overflow:hidden}
.glass-neu-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.80),transparent);pointer-events:none}

/* ===== Amount Display ===== */
.amount-section{padding:24px 20px 8px}
.amount-card{text-align:center;padding:28px 20px}
.amount-label{font-size:13px;color:var(--text-2);margin-bottom:8px}
.amount-value{font-size:44px;font-weight:700;font-family:var(--font-display);color:var(--text-1);letter-spacing:-0.03em;line-height:1.1}
.amount-value .currency{font-size:24px;margin-right:2px;vertical-align:top;font-weight:600}
.order-no{font-size:12px;color:var(--text-3);margin-top:10px}

/* ===== Payment Methods ===== */
.pay-method-list{display:flex;flex-direction:column;gap:12px}
.pay-method-item{display:flex;align-items:center;padding:16px;background:rgba(255,255,255,0.52);border-radius:var(--r-md);border:0.5px solid rgba(255,255,255,0.60);box-shadow:var(--neu-out-sm);cursor:pointer;transition:all var(--dur) var(--ease);position:relative}
.pay-method-item:active{box-shadow:var(--neu-in);transform:scale(0.98)}
.pay-method-item.selected{border:1px solid var(--brand);box-shadow:var(--neu-out-sm),0 0 0 3px var(--brand-subtle)}
.pay-method-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-right:14px;flex-shrink:0}
.pay-method-icon.wechat{background:linear-gradient(135deg,#07C160,#06AE56);color:#fff}
.pay-method-icon.alipay{background:linear-gradient(135deg,#1677FF,#0E5FD9);color:#fff}
.pay-method-icon.balance{background:linear-gradient(135deg,var(--brand),var(--brand-mid));color:#fff}
.pay-method-info{flex:1}
.pay-method-name{font-size:15px;font-weight:600;color:var(--text-1);margin-bottom:2px}
.pay-method-desc{font-size:12px;color:var(--text-2)}
.pay-method-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--neu-dark);margin-left:12px;flex-shrink:0;position:relative}
.pay-method-item.selected .pay-method-radio{border-color:var(--brand);background:var(--brand)}
.pay-method-item.selected .pay-method-radio::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#fff}

/* ===== Coupon Selector ===== */
.coupon-selector{display:flex;align-items:center;justify-content:space-between;padding:16px;background:rgba(255,255,255,0.52);border-radius:var(--r-md);border:0.5px solid rgba(255,255,255,0.60);box-shadow:var(--neu-out-sm);cursor:pointer}
.coupon-selector:active{box-shadow:var(--neu-in)}
.coupon-left{display:flex;align-items:center;gap:10px}
.coupon-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;display:flex;align-items:center;justify-content:center}
.coupon-text{font-size:14px;color:var(--text-1);font-weight:500}
.coupon-discount{font-size:14px;color:var(--red);font-weight:600}
.coupon-arrow{color:var(--text-3)}

/* ===== Order Detail ===== */
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--sep)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:13.5px;color:var(--text-2)}
.detail-value{font-size:13.5px;color:var(--text-1);font-weight:500}
.detail-value.highlight{color:var(--brand);font-weight:600}

/* ===== Bottom Payment Bar ===== */
.pay-bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:414px;z-index:100;padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,0.72);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-top:0.5px solid rgba(255,255,255,0.60);box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.pay-bottom-inner{display:flex;align-items:center;justify-content:space-between}
.pay-total-label{font-size:13px;color:var(--text-2)}
.pay-total-amount{font-size:24px;font-weight:700;font-family:var(--font-display);color:var(--text-1);letter-spacing:-0.02em}
.pay-total-amount .currency{font-size:14px;vertical-align:top;margin-right:2px}
.pay-now-btn{padding:14px 36px;background:var(--brand-gradient);color:#fff;font-size:16px;font-weight:700;border:none;border-radius:9999px;cursor:pointer;box-shadow:var(--neu-out-sm),0 4px 14px var(--brand-glow);transition:all var(--dur) var(--spring)}
.pay-now-btn:active{transform:scale(0.94);box-shadow:var(--neu-in)}

/* ===== Security Tip ===== */
.security-tip{display:flex;align-items:center;justify-content:center;gap:6px;padding:16px 20px;font-size:12px;color:var(--text-3)}
.security-icon{color:var(--green)}
    </style>
</head>
<body>
<div class="phone" data-dom-id="page-client-payment">

  <!-- ===== TOP NAV BAR ===== -->
  <header class="nav-bar">
    <button class="nav-icon-btn" data-dom-id="back-btn" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 class="nav-title">确认支付</h1>
    <button class="nav-icon-btn" data-dom-id="help-btn" aria-label="帮助">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
    </button>
  </header>

  <!-- ===== AMOUNT DISPLAY ===== -->
  <section class="amount-section">
    <div class="glass-neu-card amount-card" data-dom-id="amount-card">
      <div class="amount-label">支付金额</div>
      <div class="amount-value mono"><span class="currency">&yen;</span>168.00</div>
      <div class="order-no">订单号：ZJR202608030001</div>
    </div>
  </section>

  <!-- ===== PAYMENT METHODS ===== -->
  <section class="section">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      支付方式
    </div>
    <div class="pay-method-list" data-dom-id="pay-methods">
      <div class="pay-method-item selected" data-dom-id="pay-wechat">
        <div class="pay-method-icon wechat">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-7.062-6.122zm-2.036 2.83c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
        </div>
        <div class="pay-method-info">
          <div class="pay-method-name">微信支付</div>
          <div class="pay-method-desc">推荐使用，安全便捷</div>
        </div>
        <div class="pay-method-radio"></div>
      </div>

      <div class="pay-method-item" data-dom-id="pay-alipay">
        <div class="pay-method-icon alipay">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M21.422 15.358c-3.83-1.153-6.055-1.84-7.418-2.313.57-1.357.987-2.827 1.22-4.4h-3.056v-1.237h3.774V6.247h-3.774V4h-1.748v2.247H7.128v1.161h3.292v1.237H6.592v1.16h6.894c-.208 1.178-.536 2.322-.983 3.408-2.09-.656-4.247-1.09-6.414-1.285V14.7c1.51.19 2.986.523 4.404.986-1.335 1.786-3.034 3.037-5.054 3.73l1.063 1.53c3.492-1.285 5.842-3.378 7.15-5.938 2.103.734 4.896 1.85 7.766 3.335l1.003-2.985zM3 2.5C1.6 2.5.5 3.6.5 5v14c0 1.4 1.1 2.5 2.5 2.5h18c1.4 0 2.5-1.1 2.5-2.5v-14c0-1.4-1.1-2.5-2.5-2.5H3z"/></svg>
        </div>
        <div class="pay-method-info">
          <div class="pay-method-name">支付宝</div>
          <div class="pay-method-desc">支付宝快捷支付</div>
        </div>
        <div class="pay-method-radio"></div>
      </div>

      <div class="pay-method-item" data-dom-id="pay-balance">
        <div class="pay-method-icon balance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="pay-method-info">
          <div class="pay-method-name">余额支付</div>
          <div class="pay-method-desc">可用余额 &yen;356.80</div>
        </div>
        <div class="pay-method-radio"></div>
      </div>
    </div>
  </section>

  <!-- ===== COUPON ===== -->
  <section class="section">
    <div class="coupon-selector" data-dom-id="coupon-selector">
      <div class="coupon-left">
        <div class="coupon-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 7v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1Z"/><path d="M9 12h.01M15 12h.01M3 10h18"/></svg>
        </div>
        <span class="coupon-text">优惠券</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="coupon-discount">- &yen;10.00</span>
        <svg class="coupon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>
  </section>

  <!-- ===== ORDER DETAIL ===== -->
  <section class="section">
    <div class="section-title">费用明细</div>
    <div class="glass-neu-card" data-dom-id="fee-detail">
      <div class="detail-row">
        <span class="detail-label">服务费</span>
        <span class="detail-value mono">&yen;158.00</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">上门费</span>
        <span class="detail-value mono">&yen;20.00</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">优惠券抵扣</span>
        <span class="detail-value highlight mono">- &yen;10.00</span>
      </div>
      <div class="detail-row" style="padding-top:12px;border-top:1px dashed var(--sep);border-bottom:none">
        <span class="detail-label" style="font-weight:600;color:var(--text-1)">实付金额</span>
        <span class="detail-value" style="font-size:18px;font-weight:700;color:var(--brand)" class="mono">&yen;168.00</span>
      </div>
    </div>
  </section>

  <!-- ===== SECURITY TIP ===== -->
  <div class="security-tip">
    <svg class="security-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>支付安全由微信支付保障</span>
  </div>

  <!-- ===== BOTTOM PAYMENT BAR ===== -->
  <div class="pay-bottom-bar">
    <div class="pay-bottom-inner">
      <div>
        <div class="pay-total-label">合计</div>
        <div class="pay-total-amount mono"><span class="currency">&yen;</span>168.00</div>
      </div>
      <button class="pay-now-btn" data-dom-id="pay-now-btn">立即支付</button>
    </div>
  </div>

</div>
</body>
</html>
