<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简克制</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f5f5f7;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
}
.wrapper {
  max-width: 414px;
  width: 100%;
  padding: 40px 20px;
}
.badge {
  display: inline-block;
  background: #1d1d1f;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 999px;
  letter-spacing: 0.05em;
  margin-bottom: 16px;
}
h1 {
  font-size: 28px;
  font-weight: 700;
  color: #1d1d1f;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}
.subtitle {
  font-size: 15px;
  color: #86868b;
  margin-bottom: 24px;
  line-height: 1.5;
}
.img-frame {
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.04);
}
.img-frame img {
  width: 100%;
  display: block;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}
.tag {
  font-size: 12px;
  color: #1d1d1f;
  background: rgba(0,0,0,0.05);
  padding: 6px 14px;
  border-radius: 999px;
}
</style>
</head>
<body>
<div class="wrapper">
  <span class="badge">风格方案</span>
  <h1>极简克制</h1>
  <p class="subtitle">纯白底色，0.5px 精细线条，黑蓝双色，大量留白，瑞士排版风格。像高端设计工作室出的产品，每个像素都有理由。</p>
  <div class="img-frame">
    <img src="../assets/style-ref-minimal-swiss.jpg" alt="极简克制">
  </div>
  <div class="tags">
    <span class="tag">纯白</span>
    <span class="tag">精细线条</span>
    <span class="tag">大量留白</span>
    <span class="tag">瑞士排版</span>
    <span class="tag">几何图标</span>
    <span class="tag">黑蓝双色</span>
    <span class="tag">高级感</span>
  </div>
</div>
</body>
</html>
