<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风格参考 — Dark Luxury</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #F0F0F0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 0;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', 'PingFang SC', system-ui, sans-serif;
}
.phone {
  width: 414px;
  min-height: 896px;
  background: #0F0F14;
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  border-radius: 40px;
}
/* Hero dark gradient */
.hero {
  height: 280px;
  background: linear-gradient(180deg, #1a1a2e 0%, #0F0F14 100%);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(212,168,83,0.08), transparent 70%);
  top: -60px;
  right: -40px;
  border-radius: 50%;
}
.hero::after {
  content: '';
  position: absolute;
  width: 180px;
  height: 180px;
  background: radial-gradient(circle, rgba(125,211,252,0.06), transparent 70%);
  bottom: -30px;
  left: -30px;
  border-radius: 50%;
}
/* Style label */
.style-label {
  position: absolute;
  top: 16px;
  left: 16px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(212,168,83,0.2);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 600;
  color: #D4A853;
  z-index: 10;
  letter-spacing: 1px;
}
/* Status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px 0;
  position: relative;
  z-index: 5;
}
.status-bar .time {
  font-size: 15px;
  font-weight: 600;
  color: #E2E8F0;
}
.status-bar .icons {
  display: flex;
  gap: 6px;
  align-items: center;
}
/* Header */
.header {
  padding: 24px 24px 0;
  position: relative;
  z-index: 5;
}
.greeting {
  font-size: 14px;
  color: #718096;
  margin-bottom: 4px;
}
.app-name {
  font-size: 26px;
  font-weight: 700;
  color: #E2E8F0;
  margin-bottom: 16px;
}
.app-name em {
  font-style: normal;
  color: #D4A853;
}
/* Search bar glass dark */
.search-bar {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  display: flex;
  align-items: center;
  padding: 14px 18px;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.search-bar svg {
  flex-shrink: 0;
}
.search-bar input {
  border: none;
  outline: none;
  background: transparent;
  font-size: 15px;
  color: #718096;
  width: 100%;
  font-family: inherit;
}
/* Trust stats row */
.stats-row {
  display: flex;
  justify-content: space-around;
  padding: 20px 16px;
  position: relative;
  z-index: 5;
}
.stat-item {
  text-align: center;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 16px 8px 14px;
  flex: 1;
  margin: 0 4px;
}
.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: #D4A853;
  margin-bottom: 4px;
}
.stat-value.ice {
  color: #7DD3FC;
}
.stat-label {
  font-size: 11px;
  color: #718096;
}
/* Section title */
.section-title {
  font-size: 18px;
  font-weight: 600;
  color: #E2E8F0;
  padding: 8px 24px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  width: 3px;
  height: 16px;
  background: #D4A853;
  border-radius: 2px;
}
/* Service grid */
.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 24px 20px;
}
.service-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  padding: 22px 8px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  position: relative;
}
.service-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(212,168,83,0.06);
  border: 1px solid rgba(212,168,83,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 0 20px rgba(212,168,83,0.08);
}
.service-icon svg {
  width: 22px;
  height: 22px;
  stroke: #D4A853;
}
.service-name {
  font-size: 13px;
  font-weight: 500;
  color: #E2E8F0;
}
/* Recommend card */
.recommend-card {
  margin: 0 24px 16px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.15);
}
.recommend-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(212,168,83,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 16px rgba(212,168,83,0.06);
}
.recommend-avatar svg {
  width: 24px;
  height: 24px;
  stroke: #D4A853;
}
.recommend-info h4 {
  font-size: 15px;
  font-weight: 600;
  color: #E2E8F0;
  margin-bottom: 4px;
}
.recommend-info p {
  font-size: 12px;
  color: #718096;
}
.recommend-price {
  margin-left: auto;
  text-align: right;
  flex-shrink: 0;
}
.recommend-price .price {
  font-size: 18px;
  font-weight: 700;
  color: #D4A853;
}
.recommend-price .unit {
  font-size: 11px;
  color: #718096;
}
/* Thin divider */
.divider {
  height: 1px;
  background: rgba(255,255,255,0.06);
  margin: 0 24px;
}
/* Floating nav bar dark glass */
.nav-bar {
  position: absolute;
  bottom: 30px;
  left: 24px;
  right: 24px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 24px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 14px 8px 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  z-index: 20;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.nav-item svg {
  width: 22px;
  height: 22px;
}
.nav-item span {
  font-size: 11px;
  font-weight: 500;
  color: #4A5568;
}
.nav-item.active svg {
  stroke: #D4A853;
}
.nav-item.active span {
  color: #D4A853;
  font-weight: 600;
}
.nav-item:not(.active) svg {
  stroke: #4A5568;
}
</style>
</head>
<body>
<div class="phone">
  <div class="style-label">DARK LUXURY</div>
  <div class="hero">
    <div class="status-bar">
      <span class="time">21:30</span>
      <div class="icons">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#718096" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#718096" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>
      </div>
    </div>
    <div class="header">
      <div class="greeting">晚上好</div>
      <div class="app-name">自家人<em>维修</em></div>
      <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#718096" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="搜索服务" readonly>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-value">8,247</div>
        <div class="stat-label">认证师傅</div>
      </div>
      <div class="stat-item">
        <div class="stat-value ice">98.6%</div>
        <div class="stat-label">好评率</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">3s</div>
        <div class="stat-label">快速响应</div>
      </div>
    </div>
  </div>

  <div class="section-title">热门服务</div>
  <div class="service-grid">
    <div class="service-card">
      <div class="service-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </div>
      <div class="service-name">防水维修</div>
    </div>
    <div class="service-card">
      <div class="service-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M17 2l-5 5-5-5"/></svg>
      </div>
      <div class="service-name">家电维修</div>
    </div>
    <div class="service-card">
      <div class="service-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
      </div>
      <div class="service-name">管道疏通</div>
    </div>
    <div class="service-card">
      <div class="service-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="11" rx="2"/><circle cx="12" cy="16" r="1"/><circle cx="12" cy="5" r="3"/><line x1="12" y1="8" x2="12" y2="11"/></svg>
      </div>
      <div class="service-name">开锁换锁</div>
    </div>
    <div class="service-card">
      <div class="service-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <div class="service-name">家政清洁</div>
    </div>
    <div class="service-card">
      <div class="service-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      </div>
      <div class="service-name">墙面翻新</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section-title">推荐师傅</div>
  <div class="recommend-card">
    <div class="recommend-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="recommend-info">
      <h4>王师傅 · 防水专家</h4>
      <p>服务 1,280 单 · 好评 99.2%</p>
    </div>
    <div class="recommend-price">
      <div class="price">¥68</div>
      <div class="unit">起</div>
    </div>
  </div>

  <div class="recommend-card" style="margin-bottom: 120px;">
    <div class="recommend-avatar" style="border-color: rgba(125,211,252,0.2); box-shadow: 0 0 16px rgba(125,211,252,0.06);">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="stroke:#7DD3FC;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="recommend-info">
      <h4>李师傅 · 家电维修</h4>
      <p>服务 856 单 · 好评 98.8%</p>
    </div>
    <div class="recommend-price">
      <div class="price" style="color:#7DD3FC;">¥45</div>
      <div class="unit">起</div>
    </div>
  </div>

  <!-- Floating nav bar -->
  <div class="nav-bar">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>发布</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>订单</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </div>
  </div>
</div>
</body>
</html>
