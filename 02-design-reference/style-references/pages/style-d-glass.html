<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风格参考 — Glassmorphism Premium</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #F0F0F0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 0;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', 'PingFang SC', system-ui, sans-serif;
}
.phone {
  width: 414px;
  min-height: 896px;
  background: #FFFFFF;
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  border-radius: 40px;
}
/* Hero gradient mesh */
.hero {
  height: 280px;
  background: linear-gradient(135deg, rgba(13,148,136,0.12) 0%, rgba(245,158,11,0.10) 50%, rgba(13,148,136,0.08) 100%);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(13,148,136,0.15), transparent 70%);
  top: -80px;
  right: -60px;
  border-radius: 50%;
}
.hero::after {
  content: '';
  position: absolute;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(245,158,11,0.12), transparent 70%);
  bottom: -40px;
  left: -40px;
  border-radius: 50%;
}
/* Style label */
.style-label {
  position: absolute;
  top: 16px;
  left: 16px;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 600;
  color: #0D9488;
  z-index: 10;
  letter-spacing: 0.5px;
}
/* Status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px 0;
  position: relative;
  z-index: 5;
}
.status-bar .time {
  font-size: 15px;
  font-weight: 600;
  color: #2D3748;
}
.status-bar .icons {
  display: flex;
  gap: 6px;
  align-items: center;
}
/* Header */
.header {
  padding: 24px 24px 0;
  position: relative;
  z-index: 5;
}
.greeting {
  font-size: 14px;
  color: #718096;
  margin-bottom: 4px;
}
.app-name {
  font-size: 26px;
  font-weight: 700;
  color: #1A202C;
  margin-bottom: 16px;
}
/* Search bar glass */
.search-bar {
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 16px;
  display: flex;
  align-items: center;
  padding: 14px 18px;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}
.search-bar svg {
  flex-shrink: 0;
}
.search-bar input {
  border: none;
  outline: none;
  background: transparent;
  font-size: 15px;
  color: #A0AEC0;
  width: 100%;
  font-family: inherit;
}
/* Trust stats row */
.stats-row {
  display: flex;
  justify-content: space-around;
  padding: 20px 16px;
  position: relative;
  z-index: 5;
}
.stat-item {
  text-align: center;
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 16px;
  padding: 16px 12px 14px;
  flex: 1;
  margin: 0 4px;
}
.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: #0D9488;
  margin-bottom: 4px;
}
.stat-value.amber {
  color: #F59E0B;
}
.stat-label {
  font-size: 11px;
  color: #718096;
}
/* Section title */
.section-title {
  font-size: 18px;
  font-weight: 600;
  color: #1A202C;
  padding: 8px 24px 14px;
}
/* Service grid */
.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 24px 20px;
}
.service-card {
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.65);
  border-radius: 20px;
  padding: 20px 8px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.03);
}
.service-icon {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(13,148,136,0.10), rgba(245,158,11,0.08));
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,0.7);
}
.service-icon svg {
  width: 24px;
  height: 24px;
  stroke: #0D9488;
}
.service-name {
  font-size: 13px;
  font-weight: 500;
  color: #2D3748;
}
/* Floating glass nav bar */
.nav-bar {
  position: absolute;
  bottom: 30px;
  left: 24px;
  right: 24px;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 24px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 12px 8px 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  z-index: 20;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.nav-item svg {
  width: 22px;
  height: 22px;
}
.nav-item span {
  font-size: 11px;
  font-weight: 500;
  color: #A0AEC0;
}
.nav-item.active svg {
  stroke: #0D9488;
}
.nav-item.active span {
  color: #0D9488;
  font-weight: 600;
}
.nav-item:not(.active) svg {
  stroke: #A0AEC0;
}
/* Recommend card */
.recommend-card {
  margin: 0 24px 16px;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.65);
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.03);
  display: flex;
  align-items: center;
  gap: 14px;
}
.recommend-img {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(13,148,136,0.12), rgba(245,158,11,0.10));
  flex-shrink: 0;
}
.recommend-info h4 {
  font-size: 15px;
  font-weight: 600;
  color: #1A202C;
  margin-bottom: 4px;
}
.recommend-info p {
  font-size: 12px;
  color: #A0AEC0;
}
.recommend-price {
  margin-left: auto;
  text-align: right;
  flex-shrink: 0;
}
.recommend-price .price {
  font-size: 18px;
  font-weight: 700;
  color: #0D9488;
}
.recommend-price .unit {
  font-size: 11px;
  color: #A0AEC0;
}
</style>
</head>
<body>

  <div class="hero">
    <div class="status-bar">
      <span class="time">21:30</span>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D3748" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
