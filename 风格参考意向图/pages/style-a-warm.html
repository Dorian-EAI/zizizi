<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温润信任</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f5f5f7;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
}
.wrapper {
  max-width: 414px;
  width: 100%;
  padding: 40px 20px;
}
.badge {
  display: inline-block;
  background: #1d1d1f;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 999px;
  letter-spacing: 0.05em;
  margin-bottom: 16px;
}
h1 {
  font-size: 28px;
  font-weight: 700;
  color: #1d1d1f;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}
.subtitle {
  font-size: 15px;
  color: #86868b;
  margin-bottom: 24px;
  line-height: 1.5;
}
.img-frame {
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.04);
}
.img-frame img {
  width: 100%;
  display: block;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}
.tag {
  font-size: 12px;
  color: #1d1d1f;
  background: rgba(0,0,0,0.05);
  padding: 6px 14px;
  border-radius: 999px;
}
</style>
</head>
<body>
<div class="wrapper">
  <span class="badge">风格方案</span>
  <h1>温润信任</h1>
  <p class="subtitle">暖调米白底色，赤陶色与鼠尾草绿点缀，柔和阴影与圆润卡片，传递邻家服务的可信赖感。适合重视人情味和信任感的居家服务场景。</p>
  <div class="img-frame">
    <img src="../assets/style-ref-warm-trust.jpg" alt="温润信任">
  </div>
  <div class="tags">
    <span class="tag">暖色调</span>
    <span class="tag">柔和阴影</span>
    <span class="tag">圆润友好</span>
    <span class="tag">邻家感</span>
    <span class="tag">赤陶色</span>
    <span class="tag">鼠尾草绿</span>
    <span class="tag">高信任度</span>
  </div>
</div>
</body>
</html>
