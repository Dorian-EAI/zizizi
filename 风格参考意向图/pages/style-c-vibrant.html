<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活力渐变</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f5f5f7;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
}
.wrapper {
  max-width: 414px;
  width: 100%;
  padding: 40px 20px;
}
.badge {
  display: inline-block;
  background: #1d1d1f;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 999px;
  letter-spacing: 0.05em;
  margin-bottom: 16px;
}
h1 {
  font-size: 28px;
  font-weight: 700;
  color: #1d1d1f;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}
.subtitle {
  font-size: 15px;
  color: #86868b;
  margin-bottom: 24px;
  line-height: 1.5;
}
.img-frame {
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.04);
}
.img-frame img {
  width: 100%;
  display: block;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}
.tag {
  font-size: 12px;
  color: #1d1d1f;
  background: rgba(0,0,0,0.05);
  padding: 6px 14px;
  border-radius: 999px;
}
</style>
</head>
<body>
<div class="wrapper">
  <span class="badge">风格方案</span>
  <h1>活力渐变</h1>
  <p class="subtitle">珊瑚红、电光蓝、暖黄大胆渐变，白色卡片配彩色点缀，圆润形状，年轻动感的创业公司气质。适合想打破行业沉闷感的品牌。</p>
  <div class="img-frame">
    <img src="../assets/style-ref-vibrant-gradient.jpg" alt="活力渐变">
  </div>
  <div class="tags">
    <span class="tag">大胆渐变</span>
    <span class="tag">彩色点缀</span>
    <span class="tag">年轻动感</span>
    <span class="tag">圆润形状</span>
    <span class="tag">珊瑚红</span>
    <span class="tag">电光蓝</span>
    <span class="tag">创业气质</span>
  </div>
</div>
</body>
</html>
